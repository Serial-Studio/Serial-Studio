[pytest]
# Serial Studio pytest configuration

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = integration performance security scripts

# Minimum Python version
minversion = 3.8

# Console output
console_output_style = progress
log_cli = false
log_cli_level = INFO

# Warnings
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: integration tests requiring running Serial Studio instance
    performance: performance benchmarks
    requires_device: tests requiring physical hardware
    network: tests using network driver
    uart: tests using UART driver
    ble: tests using Bluetooth LE driver
    csv: tests involving CSV export
    mdf4: tests involving MDF4 export (Pro feature)
    pro: tests covering Pro-only features (Modbus, CAN Bus, etc.)
    project: tests involving project files
    security: security and robustness tests
    probe: active robustness probes (may crash server)
    resource_exhaustion: resource-exhaustion probes
    dos: denial-of-service probes (deselected in CI with -m "not dos")
    fuzzing: fuzzing tests
    critical: tests for critical-severity findings
    high: tests for high-severity findings
    medium: tests for medium-severity findings
    destructive: tests that may crash or hang the server (run with caution)
    requires_broker: tests that require a live MQTT broker on 127.0.0.1:1883
    mqtt: tests covering the MQTT input driver, publisher or scripting API
    audio: tests covering the audio driver / virtual-microphone loopback pipeline
    mirror: tests covering the spec-0040 remote dashboard mirror (needs a live capture instance)
    opcua: tests covering the OPC UA driver (spec 0066)
    requires_opcua_sim: tests that require the OPC UA simulator on 127.0.0.1:4840

# Timeout for tests (prevent hanging)
timeout = 30
timeout_method = thread

# Coverage options
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# xdist parallel execution
# Run with: pytest -n auto
