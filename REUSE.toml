version = 1
SPDX-PackageName = "Serial Studio"
SPDX-PackageSupplier = "Alex Spataru <alex@serial-studio.com>"
SPDX-PackageDownloadLocation = "https://github.com/Serial-Studio/Serial-Studio"

# ------------------------------------------------------------------------------------------------
# First-party assets under app/rcc. Subdirectories are listed one by one so that the third-party
# trees (fonts/, vendor/) can never be swallowed by a wildcard: app/rcc/** would cover them too.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = [
  "app/rcc/actions/**",
  "app/rcc/ai/**",
  "app/rcc/api/**",
  "app/rcc/chartjs/**",
  "app/rcc/commands/**",
  "app/rcc/demo/**",
  "app/rcc/extensions/**",
  "app/rcc/icons/**",
  "app/rcc/images/**",
  "app/rcc/instruments/**",
  "app/rcc/logo/**",
  "app/rcc/messages/**",
  "app/rcc/properties/**",
  "app/rcc/scripts/**",
  "app/rcc/templates/**",
  "app/rcc/themes/**",
  "app/rcc/chat-viewer.html",
  "app/rcc/markdown-viewer.html",
  "app/rcc/rcc.qrc",
]
SPDX-FileCopyrightText = "2020-2026 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-SerialStudio-Commercial"

# ------------------------------------------------------------------------------------------------
# First-party build glue, docs, examples, tooling and repo metadata. The default precedence
# ("closest") means a file's own SPDX header always wins; these globs only cover what has none.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = [
  "app/deploy/**",
  "app/translations/**",
  "cmake/**",
  "doc/**",
  "examples/**",
  "scripts/**",
  "app/tests/fuzz/corpus/**",
  "tests/**",
  "lib/VERSIONS.json",
  "app/qml/qmllint-baseline.json",
  ".github/**",
  "*.md",
  "updates.json",
  ".clang-format",
  ".clang-tidy",
  ".gitattributes",
  ".gitignore",
]
SPDX-FileCopyrightText = "2020-2026 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-SerialStudio-Commercial"

# The agent skills quote SPDX headers inside fenced code samples, so a header scan of these files
# picks up a truncated expression; "override" makes the annotation the only source of truth.

[[annotations]]
path = [".claude/**"]
precedence = "override"
SPDX-FileCopyrightText = "2020-2026 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-SerialStudio-Commercial"

# ------------------------------------------------------------------------------------------------
# Bundled fonts. OFL-1.1 requires the license text to travel with the fonts; LICENSES/OFL-1.1.txt
# is what satisfies that obligation for the shipped binaries and installers.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = ["app/rcc/fonts/GeistMono-*.ttf"]
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font.git)"
SPDX-License-Identifier = "OFL-1.1"

# ------------------------------------------------------------------------------------------------
# Vendored web assets for the AI chat / markdown viewers. Each upstream bundle keeps its own
# .LICENSE sidecar; the sidecar itself is covered by the same annotation as the code it documents.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = ["app/rcc/vendor/highlight*"]
SPDX-FileCopyrightText = "2006 Ivan Sagalaev and other contributors"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["app/rcc/vendor/katex*", "app/rcc/vendor/katex-fonts/**"]
SPDX-FileCopyrightText = "2013-2020 Khan Academy and other contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["app/rcc/vendor/mermaid*"]
SPDX-FileCopyrightText = "2014-2025 Knut Sveidqvist"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["app/rcc/vendor/showdown*"]
SPDX-FileCopyrightText = "2018, 2021 ShowdownJS"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["app/rcc/vendor/sanitize*"]
SPDX-FileCopyrightText = "2020-2026 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-SerialStudio-Commercial"

# ------------------------------------------------------------------------------------------------
# Vendored single-header C/C++ libraries. Declared here rather than by editing the files so that
# future upstream drops stay byte-identical and diffable.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = ["app/src/ThirdParty/miniaudio.h", "app/src/ThirdParty/miniaudio.cpp"]
SPDX-FileCopyrightText = "2025 David Reid"
SPDX-License-Identifier = "MIT-0 OR Unlicense"

[[annotations]]
path = ["app/src/ThirdParty/fast_float.h"]
SPDX-FileCopyrightText = "2021 The fast_float authors"
SPDX-License-Identifier = "Apache-2.0 OR MIT OR BSL-1.0"

[[annotations]]
path = [
  "app/src/ThirdParty/readerwriterqueue.h",
  "app/src/ThirdParty/readerwritercircularbuffer.h",
]
SPDX-FileCopyrightText = "2013-2020 Cameron Desrochers"
SPDX-License-Identifier = "BSD-2-Clause"

# atomicops.h embeds Jeff Preshing's semaphore under its own zlib license, quoted in the file.
[[annotations]]
path = ["app/src/ThirdParty/atomicops.h"]
SPDX-FileCopyrightText = ["2013-2016 Cameron Desrochers", "2015 Jeff Preshing"]
SPDX-License-Identifier = "BSD-2-Clause AND Zlib"

[[annotations]]
path = ["app/src/ThirdParty/tweetnacl.h", "app/src/ThirdParty/tweetnacl.c"]
SPDX-FileCopyrightText = "2014 Daniel J. Bernstein, Bernard van Gastel, Wesley Janssen, Tanja Lange, Peter Schwabe, Sjaak Smetsers"
SPDX-License-Identifier = "LicenseRef-PublicDomain"

# ------------------------------------------------------------------------------------------------
# Vendored libraries under lib/. There are no git submodules, so REUSE sees every one of these
# files as ours to declare. "override" is used for the trees whose upstream tarball ships
# generated documentation containing HTML-escaped SPDX tags that no longer parse as expressions.
# ------------------------------------------------------------------------------------------------

[[annotations]]
path = ["lib/hidapi/**"]
SPDX-FileCopyrightText = "2010 Alan Ott, Signal 11 Software"
SPDX-License-Identifier = "GPL-3.0-only OR BSD-3-Clause OR LicenseRef-HIDAPI-Original"

[[annotations]]
path = ["lib/KissFFT/**"]
SPDX-FileCopyrightText = "2003-2010 Mark Borgerding"
SPDX-License-Identifier = "BSD-3-Clause"

[[annotations]]
path = ["lib/luajit/**"]
SPDX-FileCopyrightText = "2005-2026 Mike Pall"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["lib/mdflib/**"]
precedence = "override"
SPDX-FileCopyrightText = "2022 Ingemar Hedvall"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["lib/QCodeEditor/**"]
SPDX-FileCopyrightText = "2013-2019 Megaxela"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["lib/QSimpleUpdater/**"]
SPDX-FileCopyrightText = "2014-2025 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = ["lib/open62541/open62541.c", "lib/open62541/open62541.h", "lib/open62541/LICENSE"]
SPDX-FileCopyrightText = "2014-2026 The open62541 authors"
SPDX-License-Identifier = "MPL-2.0"

# Mbed TLS is dual Apache-2.0 OR GPL-2.0-or-later; Serial Studio takes the Apache-2.0 arm, which
# is the one compatible with both distribution terms this project ships under.
[[annotations]]
path = ["lib/mbedtls/**"]
precedence = "override"
SPDX-FileCopyrightText = "2006-2026 The Mbed TLS Contributors"
SPDX-License-Identifier = "Apache-2.0"

# libplctag (MPL-2.0) is FETCHED at configure time, never vendored, so the only file this
# repository carries for it is the Serial-Studio-authored CMakeLists that assembles the build. Its
# upstream sources land in the build tree and are declared by their own project; nothing here is
# theirs to cover. MPL-2.0 is file-level copyleft, so static linkage carries no relink duty.
#
# No dependency of this project is LGPL. The S7comm client is first-party Qt-Core code under
# app/src/IO/Drivers/S7, so nothing here obliges a release to ship a replaceable shared library or
# to keep a relink path open. Any future dependency must be checked against PROPRIETARY
# distribution, not only against the GPL, before it is added.
[[annotations]]
path = [
  "lib/CMakeLists.txt",
  "lib/OpenSSL/**",
  "lib/libplctag/**",
]
SPDX-FileCopyrightText = "2020-2026 Alex Spataru <alex@serial-studio.com>"
SPDX-License-Identifier = "GPL-3.0-or-later OR LicenseRef-SerialStudio-Commercial"
