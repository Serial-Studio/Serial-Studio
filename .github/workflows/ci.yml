#---------------------------------------------------------------------------------------------------
# Workflow configuration
#---------------------------------------------------------------------------------------------------

name: CI

on:
  push:             
    paths-ignore:     
    - '**.md'        

  pull_request:       
    paths-ignore:   
    - '**.md'         

#---------------------------------------------------------------------------------------------------
# Workflow environment
#---------------------------------------------------------------------------------------------------

env:

  #
  # Application information
  #
  VERSION: "4.1.0"
  PUBLISHER: "Alex Spataru"
  UNIXNAME: "serial-studio-pro"
  EXECUTABLE: "Serial-Studio-Pro"
  APPLICATION: "Serial Studio Pro"
  DESCRIPTION: "Multi-purpose serial data visualization & processing program"

  #
  # Microsoft Store (MSIX) package identity
  #
  MSIX_IDENTITY_NAME: "AlexSpataru.SerialStudioPro"
  MSIX_PUBLISHER: "CN=05B4181B-4085-4067-8FAF-BD59DCB9A376"
  MSIX_PUBLISHER_DISPLAY: "Alex Spataru"

  #
  # QML location (for windeployqt/macdeployqt)
  #
  QML_DIR: "../../app/qml"

  #
  # Qt version selection
  #
  QT_VERSION_LINUX: 6.11.2
  QT_VERSION_MACOS: 6.11.2
  QT_VERSION_WINDOWS: 6.11.2
  QTFRAMEWORK_BYPASS_LICENSE_CHECK: "true"

  #
  # gRPC selection
  #
  GRPC_VERSION: 1.78.1
  GRPC_REPO: alex-spataru/gRPC-Builds

  #
  # Unity build batch size (sources per unity TU). Single source of truth for
  # every configure site: both PGO stages must see the identical value or the
  # unity TU layout diverges and profile data is silently dropped.
  #
  # Note: setting batch size to 0 results in a single TU with all sources
  #
  SS_UNITY_BATCH: 32

  #
  # Excluded AppImage libraries
  #
  LINUXDEPLOY_EXCLUDED_LIBRARIES: "libmysqlclient.so*;libqsqlmimer.so;libqsqlmysql.so;libqsqlodbc.so;libqsqlpsql.so;libqsqloci.so;libqsqldb2.so;libqsqlibase.so"


#---------------------------------------------------------------------------------------------------
# Workflow jobs
#---------------------------------------------------------------------------------------------------

jobs:

#---------------------------------------------------------------------------------------------------
# GNU/Linux build (x86_64)
#---------------------------------------------------------------------------------------------------

  build-linux:
    runs-on: ubuntu-24.04
    name: '🐧 Linux Build (x86_64)'
    permissions:
      contents: read
    steps:
    #
    # This repo has no submodules; 'submodules: recursive' is a no-op kept for future deps.
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # apt payload for a Qt 6 desktop build: the xcb/xkb platform stack, GStreamer for
    # QtMultimedia, and the packaging tools (rpm, fakeroot, python3-venv) linuxdeploy shells out to
    #
    - name: '⚙️ Install dependencies'
      uses: ./.github/actions/linux-desktop-deps

    #
    # gRPC arrives as a prebuilt tarball from GRPC_REPO; building it from source would cost more
    # than the rest of the job put together. The retry policy lives in the action, which the
    # macOS legs share
    #
    - name: '⚙️ Download prebuilt gRPC'
      uses: ./.github/actions/download-grpc
      with:
        version: ${{env.GRPC_VERSION}}
        repo: ${{env.GRPC_REPO}}
        asset: grpc-${{env.GRPC_VERSION}}-linux-x86_64.tar.gz
        prefix-dir: ${{github.workspace}}/grpc-prefix
        workspace: ${{github.workspace}}
        github-token: ${{secrets.GITHUB_TOKEN}}

    #
    # Cache restore, install-on-miss, cache save and the PATH / CMAKE_PREFIX_PATH export. This
    # job owns the save half of the entry the restore-only legs read
    #
    - name: '⚙️ Set up Qt'
      uses: ./.github/actions/setup-qt
      with:
        qt-version: ${{env.QT_VERSION_LINUX}}
        qt-dir: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64
        qt-arch: x64
        qt-host: gcc_64
        cache-key: qt-${{runner.os}}-${{env.QT_VERSION_LINUX}}-x64
        qt-username: ${{secrets.QT_USERNAME}}
        qt-password: ${{secrets.QT_PASSWORD}}

    #
    # get-cmake supplies a current CMake independently of whatever the runner image ships
    #
    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: true

    #
    # Unit tests live inside the build job so the Qt cache has one consumer per arch;
    # a parallel unit job racing this restore could get denied or evict the entry
    #
    - name: '🚧 Configure unit-test tier'
      run: |
        cmake -G Ninja -B build/unit-ci \
          -DCMAKE_BUILD_TYPE=Debug \
          -DSS_BUILD_TESTS=ON \
          -DBUILD_GPL3=ON \
          -DENABLE_GRPC=OFF \
          -DWITH_WEBENGINE=OFF \
          -DSS_USE_MIMALLOC=OFF \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON

    #
    # Lean Debug tier: GPL build, no gRPC, no WebEngine, no mimalloc, system zlib and expat;
    # the application target never builds here
    #
    - name: '🚧 Build unit-test tier'
      run: cmake --build build/unit-ci --target ss_unit_tests

    #
    # Runs on both arches: DSPSimd.h picks its SIMD lane from the target architecture
    #
    - name: '🧪 Run ctest'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --test-dir build/unit-ci --output-on-failure
    #
    # Findings G12 / M7: the repo had no QML tier, so unqualified property access and binding
    # loops were caught only by somebody noticing a runtime warning. The gate lives here rather
    # than in `lint` because qmllint needs Qt and a configured tree, and this job has both.
    # Findings are normalized without line numbers (they churn on every edit above the warning)
    # and compared against app/qml/qmllint-baseline.json
    #
    - name: '🔬 QML lint'
      run: |
        set -uo pipefail
        cmake --build build/unit-ci --target ss_qmllint > qmllint.txt 2>&1 || true
        python3 - <<'PY'
        import json, os, re, sys

        BASELINE = "app/qml/qmllint-baseline.json"
        text = open("qmllint.txt", encoding="utf-8", errors="replace").read()
        if "No rule to make target" in text or "unknown target" in text:
            sys.exit("::error::the ss_qmllint target does not exist; is Qt's qmllint installed?")

        pattern = re.compile(r"^(?:Warning|Error|Info):\s+(\S+?):\d+:\d+:\s+(.*)$")
        found = set()
        for line in text.split("\n"):
            match = pattern.match(line.strip())
            if not match:
                continue
            # qmllint prints absolute paths; key on the repo-relative part so the baseline
            # does not depend on where the workspace happened to be checked out.
            path = match.group(1).replace(os.sep, "/")
            marker = path.find("app/qml/")
            path = path[marker:] if marker >= 0 else os.path.relpath(path, os.getcwd())
            found.add(f"{path} :: {match.group(2).strip()}")

        baseline = json.load(open(BASELINE, encoding="utf-8"))
        accepted = set(baseline.get("accepted", []))
        new = sorted(found - accepted)

        print(f"{len(found)} qmllint finding(s), {len(accepted)} accepted, {len(new)} new")
        for entry in new:
            print(f"  {entry}")

        if not baseline.get("seeded"):
            print("::warning::qmllint baseline is unseeded; paste the list above into "
                  f"{BASELINE} and set seeded=true to arm the gate")
            sys.exit(0)

        if new:
            sys.exit(f"::error::{len(new)} qmllint finding(s) not in {BASELINE}")

        gone = sorted(accepted - found)
        if gone:
            print("::warning::baseline entries no longer reported; prune them: "
                  + ", ".join(gone))
        PY

    - name: '📤 Upload artifact: qmllint output'
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: qmllint-Linux-x64
        path: qmllint.txt
        if-no-files-found: ignore


    #
    # Stage 1 of the two-stage PGO flow: an instrumented Release build whose only job is to emit
    # profiles for the training runs below
    #
    - name: '🚧 Configure with CMake (PGO generate)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=GENERATE \
          -DSS_ALLOC_STATS=ON \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON \
          -DSS_INAPP_TESTS=ON \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # Finding L1: CMake composes the command line as <DEFINES> <INCLUDES> <FLAGS>, so a FORTIFY
    # level passed as a compile DEFINITION lands ahead of every -U_FORTIFY_SOURCE in FLAGS and is
    # cancelled by it -- which is how hardened Linux packages shipped with no FORTIFY at all.
    # Reading the real compile line is the only way to know which token wins, so this step derives
    # the level Hardening.cmake should have chosen and asserts the compile line agrees
    #
    - name: '🛡 Assert FORTIFY survives the compile line'
      run: |
        set -euo pipefail
        GCC_MAJOR=$(cc -dumpversion | cut -d. -f1)
        GLIBC=$(getconf GNU_LIBC_VERSION | awk '{print $2}')
        GLIBC_MAJOR=${GLIBC%%.*}
        GLIBC_MINOR=${GLIBC#*.}
        GLIBC_MINOR=${GLIBC_MINOR%%.*}
        EXPECT=2
        if [ "$GCC_MAJOR" -ge 12 ] && [ "$GLIBC_MAJOR" -ge 2 ] && [ "$GLIBC_MINOR" -ge 34 ]; then
          EXPECT=3
        fi
        echo "cc major $GCC_MAJOR, glibc $GLIBC -> expecting -D_FORTIFY_SOURCE=$EXPECT"
        LAST=$(python3 - <<'PY'
        import json, sys
        db = json.load(open("build/compile_commands.json"))
        rows = [e for e in db
                if "app/CMakeFiles" in (e.get("output") or "") + " " + (e.get("file") or "")]
        if not rows:
            sys.exit("no compile_commands.json entry for the application target")
        seen = set()
        for e in rows:
            cmd = e.get("command") or " ".join(e.get("arguments", []))
            tokens = [t for t in cmd.split() if "_FORTIFY_SOURCE" in t]
            if not tokens:
                sys.exit("no FORTIFY token on an application compile line")
            seen.add(tokens[-1])
        if len(seen) != 1:
            sys.exit("application TUs disagree on the FORTIFY level: %s" % sorted(seen))
        print(seen.pop())
        PY
        )
        echo "last FORTIFY token on the application compile line: $LAST"
        if [ "$LAST" != "-D_FORTIFY_SOURCE=$EXPECT" ]; then
          echo "::error::FORTIFY cancelled or wrong level: got '$LAST', expected -D_FORTIFY_SOURCE=$EXPECT"
          exit 1
        fi

    #
    # Builds the instrumented binary the two training runs profile
    #
    - name: '🚧 Build application (instrumented)'
      run: cmake --build build --config Release

    #
    # Pro widgets are license-gated, so an unactivated training run profiles the GPL subset
    # and the shipped binary is optimized for code no Pro user runs. A failed activation is
    # therefore a failed build, not a warning. The two training loads follow it: --min-fps 1
    # turns the benchmark into a profile generator (the real gate runs later, against the
    # optimized binary), and the big_db_test load exercises the project and dashboard paths
    # the hotpath benchmark never reaches
    #
    - name: '🏋️ PGO training runs'
      uses: ./.github/actions/pgo-train-linux
      with:
        app: ./build/app/${{env.UNIXNAME}}
        qt-lib-dir: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
        license-key: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}

    #
    # Stage 2: identical flags with PGO_STAGE=USE so the compiler consumes the profiles just
    # written
    #
    - name: '🚧 Reconfigure with CMake (PGO use)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=USE \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON \
          -DSS_INAPP_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # The binary that ships, and the one every gate below measures
    #
    - name: '🚧 Build application (PGO optimized)'
      run: cmake --build build --config Release

    #
    # Findings G12 / M7: instantiates every compiled .qml against stubbed Cpp_* globals and
    # fails on a ReferenceError -- the GPL-build-hits-a-Pro-global class of bug. This is the
    # commercial leg; the sanitize job runs the same suite on a GPL build
    #
    - name: '🧪 QML instantiation self-test'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: ./build/app/${{env.UNIXNAME}} --headless --selftest-suite qml

    #
    # The CI throughput gate: nine tiers scaled off --min-fps. A miss fails the build
    #
    - name: '🚦 Hotpath throughput gate (256 kHz)'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --headless --benchmark-hotpath --min-fps 256000 \
          --benchmark-output benchmark.txt

    #
    # Spec 0081: the runner takes the AVX2 lane on Auto, so the baseline SSE4 lane every older
    # machine runs would otherwise never be gated. Pinned, same gate. The scalar run is a readout
    # of the reference lane's cost, not a gate.
    #
    - name: '🚦 Hotpath throughput gate (256 kHz, SSE4 lane pinned)'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --headless --benchmark-hotpath --min-fps 256000 --simd sse4 \
          --benchmark-output benchmark-sse4.txt

    - name: '📈 Hotpath throughput (scalar lane, informational)'
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --headless --benchmark-hotpath --min-fps 1 --simd scalar \
          --benchmark-output benchmark-scalar.txt

    - name: '📤 Upload artifact: benchmark report (Linux x64)'
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: benchmark-Linux-x64
        path: |
          benchmark.txt
          benchmark-sse4.txt
          benchmark-scalar.txt
          pgo-train.txt

    #
    # Spec 0084: the line-table symbols objcopy split out of the stripped binary, so a profile or
    # crash stack from this exact build can be symbolicated later
    #
    - name: '📤 Upload artifact: symbols (Linux x64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: symbols-Linux-x64
        path: build/app/${{env.UNIXNAME}}.debug
        if-no-files-found: ignore

    #
    # Replays the big_db_test load against the optimized binary; catches the teardown crashes the
    # throughput benchmark never sees
    #
    - name: '🩺 Big project verification (optimized)'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: |
        bash tests/benchmarks/big_db_test/run_load.sh "./build/app/${{env.UNIXNAME}}" 15

    #
    # always(): activations are seat-limited, so a failed job still has to release the seat
    #
    - name: '🔑 Deactivate Serial Studio license'
      if: always()
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --deactivate || true

    #
    # The Linux packaging chain, shared with the other arch: signing identity, AppDir, the
    # glibc-bundled AppImage (spec 0065, the ONLY Linux packaging path), the deb/rpm pair cut
    # from that same converted tree, the glibc 2.28 smoke gate that proves the set installs on
    # Debian 10 / RHEL 8, and the signatures. Only arch strings and checksums differ
    #
    - name: '📦 Package for Linux'
      uses: ./.github/actions/package-linux
      with:
        workspace: ${{github.workspace}}
        arch-label: x64
        machine-arch: x86_64
        deb-arch: amd64
        config-arch: x86_64
        system-lib-dir: /usr/lib/x86_64-linux-gnu
        qt-plugins-path: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-x64/${{env.QT_VERSION_LINUX}}/gcc_64/plugins
        qml-dir: ${{env.QML_DIR}}
        sharun-sha256: f35d4f59f2e0b1a5ec12ef126d78197fd4fd14c6f99b4b16dee6a5ddad6baa93
        appimagetool-sha256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
        executable: ${{env.EXECUTABLE}}
        version: ${{env.VERSION}}
        unixname: ${{env.UNIXNAME}}
        description: ${{env.DESCRIPTION}}
        gpg-private-key: ${{secrets.GPG_PRIVATE_KEY}}
        gpg-passphrase: ${{secrets.GPG_PASSPHRASE}}
        gpg-key-id: ${{secrets.GPG_KEY_ID}}

    #
    # Release artifact: the Linux AppImage users download — the glibc-bundled build (spec
    # 0065) runs on everything from Debian 10 / RHEL 8 up, so it is the only one shipped
    #
    - name: '📤 Upload artifact: AppImage'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.AppImage
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.AppImage

    #
    # Release artifact: Debian package
    #
    - name: '📤 Upload artifact: .deb (x64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.deb
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.deb

    #
    # Release artifact: RPM package
    #
    - name: '📤 Upload artifact: .rpm (x64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.rpm
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.rpm

    #
    # Detached signatures plus the raw binary and the public key, so a user can verify without
    # trusting the release page; ignored when signing was skipped
    #
    - name: '📤 Upload artifact: signatures + signed binary (x64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64-signed
        if-no-files-found: ignore
        path: |
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.AppImage.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.deb.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.rpm.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-x64.asc
          signing-public-key.asc

#---------------------------------------------------------------------------------------------------
# GNU/Linux build (aarch64)
#---------------------------------------------------------------------------------------------------

  build-linux-arm64:
    runs-on: ubuntu-24.04-arm
    name: '🐧 Linux Build (arm64)'
    permissions:
      contents: read
    steps:
    #
    # This repo has no submodules; 'submodules: recursive' is a no-op kept for future deps.
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # apt payload for a Qt 6 desktop build: the xcb/xkb platform stack, GStreamer for
    # QtMultimedia, and the packaging tools (rpm, fakeroot, python3-venv) linuxdeploy shells out to
    #
    - name: '⚙️ Install dependencies'
      uses: ./.github/actions/linux-desktop-deps

    #
    # gRPC arrives as a prebuilt tarball from GRPC_REPO; building it from source would cost more
    # than the rest of the job put together. The retry policy lives in the action, which the
    # macOS legs share
    #
    - name: '⚙️ Download prebuilt gRPC'
      uses: ./.github/actions/download-grpc
      with:
        version: ${{env.GRPC_VERSION}}
        repo: ${{env.GRPC_REPO}}
        asset: grpc-${{env.GRPC_VERSION}}-linux-aarch64.tar.gz
        prefix-dir: ${{github.workspace}}/grpc-prefix
        workspace: ${{github.workspace}}
        github-token: ${{secrets.GITHUB_TOKEN}}

    #
    # Cache restore, install-on-miss, cache save and the PATH / CMAKE_PREFIX_PATH export. This
    # job owns the save half of the entry the restore-only legs read
    #
    - name: '⚙️ Set up Qt'
      uses: ./.github/actions/setup-qt
      with:
        qt-version: ${{env.QT_VERSION_LINUX}}
        qt-dir: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64
        qt-arch: arm64
        qt-host: gcc_arm64
        cache-key: qt-${{runner.os}}-${{env.QT_VERSION_LINUX}}-arm64
        cache-extra-path: ''
        qt-username: ${{secrets.QT_USERNAME}}
        qt-password: ${{secrets.QT_PASSWORD}}

    #
    # get-cmake supplies a current CMake independently of whatever the runner image ships
    #
    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: true

    #
    # Unit tests live inside the build job so the Qt cache has one consumer per arch;
    # a parallel unit job racing this restore could get denied or evict the entry
    #
    - name: '🚧 Configure unit-test tier'
      run: |
        cmake -G Ninja -B build/unit-ci \
          -DCMAKE_BUILD_TYPE=Debug \
          -DSS_BUILD_TESTS=ON \
          -DBUILD_GPL3=ON \
          -DENABLE_GRPC=OFF \
          -DWITH_WEBENGINE=OFF \
          -DSS_USE_MIMALLOC=OFF \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON

    #
    # Lean Debug tier: GPL build, no gRPC, no WebEngine, no mimalloc, system zlib and expat;
    # the application target never builds here
    #
    - name: '🚧 Build unit-test tier'
      run: cmake --build build/unit-ci --target ss_unit_tests

    #
    # Runs on both arches: DSPSimd.h picks its SIMD lane from the target architecture
    #
    - name: '🧪 Run ctest'
      env:
        QT_QPA_PLATFORM: offscreen
      run: ctest --test-dir build/unit-ci --output-on-failure

    #
    # Stage 1 of the two-stage PGO flow: an instrumented Release build whose only job is to emit
    # profiles for the training runs below
    #
    - name: '🚧 Configure with CMake (PGO generate)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=GENERATE \
          -DSS_ALLOC_STATS=ON \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON \
          -DSS_INAPP_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # Builds the instrumented binary the two training runs profile
    #
    - name: '🚧 Build application (instrumented)'
      run: cmake --build build --config Release

    #
    # Pro widgets are license-gated, so an unactivated training run profiles the GPL subset
    # and the shipped binary is optimized for code no Pro user runs. A failed activation is
    # therefore a failed build, not a warning. The two training loads follow it: --min-fps 1
    # turns the benchmark into a profile generator (the real gate runs later, against the
    # optimized binary), and the big_db_test load exercises the project and dashboard paths
    # the hotpath benchmark never reaches
    #
    - name: '🏋️ PGO training runs'
      uses: ./.github/actions/pgo-train-linux
      with:
        app: ./build/app/${{env.UNIXNAME}}
        qt-lib-dir: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/lib
        license-key: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}

    #
    # Stage 2: identical flags with PGO_STAGE=USE so the compiler consumes the profiles just
    # written
    #
    - name: '🚧 Reconfigure with CMake (PGO use)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=USE \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DUSE_SYSTEM_ZLIB=ON \
          -DUSE_SYSTEM_EXPAT=ON \
          -DSS_INAPP_TESTS=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # The binary that ships, and the one every gate below measures
    #
    - name: '🚧 Build application (PGO optimized)'
      run: cmake --build build --config Release

    #
    # The CI throughput gate: nine tiers scaled off --min-fps. A miss fails the build
    #
    - name: '🚦 Hotpath throughput gate (256 kHz)'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --headless --benchmark-hotpath --min-fps 256000 \
          --benchmark-output benchmark.txt

    #
    # Spec 0081: Auto is already the NEON lane here; the scalar run is a readout, not a gate.
    #
    - name: '📈 Hotpath throughput (scalar lane, informational)'
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --headless --benchmark-hotpath --min-fps 1 --simd scalar \
          --benchmark-output benchmark-scalar.txt

    - name: '📤 Upload artifact: benchmark report (Linux arm64)'
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: benchmark-Linux-arm64
        path: |
          benchmark.txt
          benchmark-scalar.txt
          pgo-train.txt

    - name: '📤 Upload artifact: symbols (Linux arm64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: symbols-Linux-arm64
        path: build/app/${{env.UNIXNAME}}.debug
        if-no-files-found: ignore

    #
    # Replays the big_db_test load against the optimized binary; catches the teardown crashes the
    # throughput benchmark never sees
    #
    - name: '🩺 Big project verification (optimized)'
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/lib
      run: |
        bash tests/benchmarks/big_db_test/run_load.sh "./build/app/${{env.UNIXNAME}}" 15

    #
    # always(): activations are seat-limited, so a failed job still has to release the seat
    #
    - name: '🔑 Deactivate Serial Studio license'
      if: always()
      env:
        QT_QPA_PLATFORM: offscreen
        LD_LIBRARY_PATH: >-
          ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/lib
      run: |
        ./build/app/${{env.UNIXNAME}} --deactivate || true

    #
    # The Linux packaging chain, shared with the other arch: signing identity, AppDir, the
    # glibc-bundled AppImage (spec 0065, the ONLY Linux packaging path), the deb/rpm pair cut
    # from that same converted tree, the glibc 2.28 smoke gate that proves the set installs on
    # Debian 10 / RHEL 8, and the signatures. Only arch strings and checksums differ
    #
    - name: '📦 Package for Linux'
      uses: ./.github/actions/package-linux
      with:
        workspace: ${{github.workspace}}
        arch-label: arm64
        machine-arch: aarch64
        deb-arch: arm64
        config-arch: arm64
        system-lib-dir: /usr/lib/aarch64-linux-gnu
        qt-plugins-path: ${{github.workspace}}/Qt-${{env.QT_VERSION_LINUX}}-${{runner.os}}-arm64/${{env.QT_VERSION_LINUX}}/gcc_arm64/plugins
        qml-dir: ${{env.QML_DIR}}
        sharun-sha256: bf3b8cc04e3025ef9dcd2718ee4728ccc68c941dadeeac7fdf778fc2c99d8b31
        appimagetool-sha256: f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
        executable: ${{env.EXECUTABLE}}
        version: ${{env.VERSION}}
        unixname: ${{env.UNIXNAME}}
        description: ${{env.DESCRIPTION}}
        gpg-private-key: ${{secrets.GPG_PRIVATE_KEY}}
        gpg-passphrase: ${{secrets.GPG_PASSPHRASE}}
        gpg-key-id: ${{secrets.GPG_KEY_ID}}

    #
    # Release artifact: the Linux AppImage users download — the glibc-bundled build (spec
    # 0065) runs on everything from Debian 10 / RHEL 8 up, so it is the only one shipped
    #
    - name: '📤 Upload artifact: AppImage'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.AppImage
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.AppImage

    #
    # Release artifact: Debian package
    #
    - name: '📤 Upload artifact: .deb (arm64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.deb
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.deb

    #
    # Release artifact: RPM package
    #
    - name: '📤 Upload artifact: .rpm (arm64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.rpm
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.rpm

    #
    # Detached signatures plus the raw binary and the public key, so a user can verify without
    # trusting the release page; ignored when signing was skipped
    #
    - name: '📤 Upload artifact: signatures + signed binary (arm64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64-signed
        if-no-files-found: ignore
        path: |
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.AppImage.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.deb.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.rpm.asc
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64
          ${{env.EXECUTABLE}}-${{env.VERSION}}-Linux-arm64.asc
          signing-public-key.asc

#---------------------------------------------------------------------------------------------------
# macOS arm64 slice
#---------------------------------------------------------------------------------------------------

  build-macos-arm64:
    runs-on: macos-latest
    name: '🍎 macOS Build (arm64)'
    permissions:
      contents: read
    steps:
    #
    # This repo has no submodules; 'submodules: recursive' is a no-op kept for future deps.
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      with:
        submodules: 'recursive'

    #
    # One universal tarball feeds both macOS slices, so the arm64 and x86_64 jobs stay in sync.
    # Retried for the same reason as the Linux legs; see the x86_64 job.
    #
    - name: '⚙️ Download prebuilt gRPC (universal)'
      uses: ./.github/actions/download-grpc
      with:
        version: ${{env.GRPC_VERSION}}
        repo: ${{env.GRPC_REPO}}
        asset: grpc-${{env.GRPC_VERSION}}-macos-universal.tar.gz
        prefix-dir: ${{github.workspace}}/grpc-prefix
        workspace: ${{github.workspace}}
        github-token: ${{secrets.GITHUB_TOKEN}}

    #
    # Restore-only half of the cache pair; the save step below is gated on a miss so a hit never
    # rewrites the entry
    #
    - name: '⚙️ Set up Qt'
      uses: ./.github/actions/setup-qt
      with:
        qt-version: ${{env.QT_VERSION_MACOS}}
        qt-dir: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64
        qt-arch: x64
        qt-host: macos
        cache-key: qt-${{runner.os}}-${{env.QT_VERSION_MACOS}}-arm64
        qt-username: ${{secrets.QT_USERNAME}}
        qt-password: ${{secrets.QT_PASSWORD}}

    #
    # get-cmake supplies a current CMake independently of whatever the runner image ships
    #
    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@fffaaafeea488556c2c12dad60690008bc1caacb # v4.4.2
      with:
        useLocalCache: true

    #
    # Stage 1 of the two-stage PGO flow, pinned to arm64: this job builds only the native slice
    #
    - name: '🚧 Configure with CMake (PGO generate, arm64)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=GENERATE \
          -DSS_ALLOC_STATS=ON \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_OSX_ARCHITECTURES="arm64" \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # Builds the instrumented arm64 binary the training runs profile
    #
    - name: '🚧 Build application (instrumented, arm64)'
      run: cmake --build build --config Release

    #
    # Pro widgets are license-gated, so an unactivated training run profiles the GPL subset and
    # the shipped binary is optimized for code no Pro user runs. A failed activation is therefore
    # a failed build, not a warning
    #
    - name: '🔑 Activate Serial Studio license (Pro hotpath training)'
      env:
        QT_QPA_PLATFORM: offscreen
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        ./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}} --activate "$SERIAL_STUDIO_LICENSE_KEY"

    #
    # --min-fps 1 turns the benchmark into a profile generator: the real gate runs later, against
    # the optimized binary
    #
    - name: '🏋️ PGO training run (hotpath)'
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        ./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}} --headless --benchmark-hotpath --min-fps 1 \
          --benchmark-output pgo-train.txt

    #
    # Second profile: the big_db_test load exercises the project and dashboard paths that the
    # hotpath benchmark never reaches
    #
    - name: '🏋️ PGO training run (big project)'
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        bash tests/benchmarks/big_db_test/run_load.sh "./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}}" 25

    #
    # Stage 2: LLVM_PROFDATA comes from xcrun so the merge tool matches the toolchain that wrote
    # the raw profiles
    #
    - name: '🚧 Reconfigure with CMake (PGO use, arm64)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja \
          -DSS_BUILD_COMMIT=${{ github.sha }} \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DENABLE_PGO=ON \
          -DPGO_STAGE=USE \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DLLVM_PROFDATA=$(xcrun -f llvm-profdata) \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_OSX_ARCHITECTURES="arm64" \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # The arm64 half of the universal binary the merge job assembles
    #
    - name: '🚧 Build application (PGO optimized, arm64)'
      run: cmake --build build --config Release

    #
    # The CI throughput gate: nine tiers scaled off --min-fps. A miss fails the build
    #
    - name: '🚦 Hotpath throughput gate (256 kHz)'
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        ./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}} \
          --headless --benchmark-hotpath --min-fps 256000 --benchmark-output benchmark.txt

    - name: '📤 Upload artifact: benchmark report (macOS arm64)'
      if: always()
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: benchmark-macOS-arm64
        path: |
          benchmark.txt
          pgo-train.txt

    - name: '📤 Upload artifact: symbols (macOS arm64)'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: symbols-macOS-arm64
        path: build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}}.dSYM
        if-no-files-found: ignore

    #
    # Replays the big_db_test load against the optimized binary; catches the teardown crashes the
    # throughput benchmark never sees
    #
    - name: '🩺 Big project verification (optimized)'
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        bash tests/benchmarks/big_db_test/run_load.sh "./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}}" 15

    #
    # always(): activations are seat-limited, so a failed job still has to release the seat
    #
    - name: '🔑 Deactivate Serial Studio license'
      if: always()
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        ./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}} --deactivate || true

    #
    # cpack builds the DMG from the deployed bundle
    #
    - name: '📦 Package application'
      run: |
        cd build
        cpack --verbose

    #
    # The merge job needs a bundle, not a disk image, so the .app is pulled back out of the DMG
    #
    - name: '💿 Mount DMG and copy application'
      run: |
        VOLUME=$(yes | hdiutil attach ./build/*.dmg -nobrowse | grep "Volumes" | awk '{print $3}')
        cp -a "$VOLUME/${{env.EXECUTABLE}}.app" "${{env.APPLICATION}}.app"
        hdiutil detach "$VOLUME"

    #
    # The deploy tools bundle only the native platform plugin; the integration tests run with
    # QT_QPA_PLATFORM=offscreen
    #
    - name: '🧩 Bundle offscreen platform plugin (headless CI tests)'
      run: |
        QT_PLUGINS_PATH="${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/plugins"
        DEST="${{env.APPLICATION}}.app/Contents/PlugIns/platforms"
        mkdir -p "$DEST"
        if [ -f "$QT_PLUGINS_PATH/platforms/libqoffscreen.dylib" ]; then
          cp "$QT_PLUGINS_PATH/platforms/libqoffscreen.dylib" "$DEST/"
        else
          echo "Warning: offscreen platform plugin not found at $QT_PLUGINS_PATH/platforms"
        fi

    #
    # COPYFILE_DISABLE=1 keeps AppleDouble ._ files out of the tarball, so the bundle survives the
    # round trip through the artifact store intact
    #
    - name: '🗜 Archive deployed .app'
      run: |
        COPYFILE_DISABLE=1 tar -czf macos-arm64-app.tar.gz "${{env.APPLICATION}}.app"

    #
    # retention-days: 1 marks this as an intermediate for the universal merge job, not a release
    # artifact
    #
    - name: '📤 Upload artifact: arm64 deployed .app'
      uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
      with:
        name: macos-arm64-app
        path: macos-arm64-app.tar.gz
        retention-days: 1

#---------------------------------------------------------------------------------------------------
# macOS x86_64
#---------------------------------------------------------------------------------------------------

