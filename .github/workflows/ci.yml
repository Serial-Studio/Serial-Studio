          ${{env.USERPROFILE}}/.qt-license
        key: qt-${{runner.os}}-${{env.QT_VERSION_MACOS}}-x86_64

    #
    # Qt comes from the online installer driven by scripts/install-qt.sh, using the account
    # secrets; only reached when the cache missed
    #
    - name: '⚙️ Install Qt (cache miss)'
      shell: bash
      if: steps.qt_cache.outputs.cache-hit != 'true'
      env:
        QT_VERSION: ${{env.QT_VERSION_MACOS}}
        QT_ARCH: x64
        QT_USERNAME: ${{secrets.QT_USERNAME}}
        QT_PASSWORD: ${{secrets.QT_PASSWORD}}
        QT_OUTPUT_DIR: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64
      run: |
        chmod +x ./scripts/install-qt.sh
        ./scripts/install-qt.sh

    #
    # Writes the entry the restore step looks for, keyed by OS + Qt version + arch
    #
    - name: '⚙️ Save Qt Cache'
      if: steps.qt_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64
          ${{env.USERPROFILE}}/.qt-license
        key: qt-${{runner.os}}-${{env.QT_VERSION_MACOS}}-x86_64

    #
    # Publishes bin/, libexec/ and CMAKE_PREFIX_PATH through GITHUB_PATH / GITHUB_ENV so every
    # later step in the job sees the same Qt
    #
    - name: '⚙️ Add Qt to PATH'
      shell: bash
      env:
        QT_VERSION: ${{env.QT_VERSION_MACOS}}
        QT_OUTPUT_DIR: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64
      run: |
        export QT_BIN_PATH="${QT_OUTPUT_DIR}/${QT_VERSION}/macos/bin"
        export QT_LIBEXEC_PATH="${QT_OUTPUT_DIR}/${QT_VERSION}/macos/libexec"
        export CMAKE_PREFIX_PATH="${QT_OUTPUT_DIR}/${QT_VERSION}/macos/lib/cmake"

        echo "$QT_BIN_PATH" >> $GITHUB_PATH
        echo "$QT_LIBEXEC_PATH" >> $GITHUB_PATH
        echo "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $GITHUB_ENV

    #
    # get-cmake supplies a current CMake independently of whatever the runner image ships
    #
    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@latest
      with:
        useLocalCache: true

    #
    # The x86_64 slice is cross-built and smoke-benchmarked under Rosetta on an arm64 runner
    #
    - name: '⚙️ Ensure Rosetta 2'
      run: softwareupdate --install-rosetta --agree-to-license

    #
    # No PGO here: this job only supplies the x86_64 half of the universal binary, and a Rosetta
    # profile would describe the emulator rather than the target
    #
    - name: '🚧 Configure with CMake (production, x86_64)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build \
          -DPRODUCTION_OPTIMIZATION=ON \
          -DENABLE_HARDENING=ON \
          -DENABLE_GRPC=ON \
          -DSS_UNITY_BUILD=ON \
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
          -DCMAKE_OSX_ARCHITECTURES="x86_64" \
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix;${CMAKE_PREFIX_PATH}" \
          -DBUILD_COMMERCIAL=ON \
          -DBUILD_GPL3=OFF

    #
    # Builds the x86_64 slice
    #
    - name: '🚧 Build application (x86_64)'
      run: cmake --build build --config Release -j$(getconf _NPROCESSORS_ONLN)

    #
    # continue-on-error: throughput under Rosetta says nothing about native x86_64 hardware, so
    # the number is recorded but never gates
    #
    - name: '🚦 Hotpath throughput (x86_64 / Rosetta, informational)'
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        DYLD_FRAMEWORK_PATH: ${{github.workspace}}/Qt-${{env.QT_VERSION_MACOS}}-${{runner.os}}-x64/${{env.QT_VERSION_MACOS}}/macos/lib
      run: |
        arch -x86_64 ./build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}} --headless --benchmark-hotpath --min-fps 256000

    #
    # Lifts the slice out of the bundle; the upload itself is the next step
    #
    - name: '📤 Upload artifact: x86_64 executable'
      run: cp "build/app/${{env.EXECUTABLE}}.app/Contents/MacOS/${{env.EXECUTABLE}}" "${{env.EXECUTABLE}}-x86_64"

    #
    # retention-days: 1, an intermediate consumed by the universal merge job
    #
    - name: '📤 Upload artifact: x86_64 slice'
      uses: actions/upload-artifact@v5
      with:
        name: macos-intel-exe
        path: ${{env.EXECUTABLE}}-x86_64
        retention-days: 1

#-------------------------------------------------------------------------------
# macOS universal merge + sign + notarize.
#-------------------------------------------------------------------------------

  build-macos:
    runs-on: macos-latest
    name: '🍎 macOS Build (universal)'
    needs:
      - build-macos-arm64
      - build-macos-intel
    permissions:
      contents: read
      security-events: write
    steps:
    #
    # No submodules: this job merges, signs and notarizes prebuilt artifacts and never compiles
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@v5

    #
    # create-dmg is an npm package
    #
    - name: '⚙️ Install Node'
      uses: actions/setup-node@v6
      with:
        node-version: 22

    #
    # The deployed arm64 bundle produced by build-macos-arm64
    #
    - name: '📥 Download arm64 deployed .app'
      uses: actions/download-artifact@v5
      with:
        name: macos-arm64-app
        path: .

    #
    # The bare x86_64 executable produced by build-macos-intel
    #
    - name: '📥 Download x86_64 slice'
      uses: actions/download-artifact@v5
      with:
        name: macos-intel-exe
        path: ./intel-slice

    #
    # Unpacks the bundle the lipo step edits in place
    #
    - name: '🗜 Unpack deployed .app'
      run: tar -xzf macos-arm64-app.tar.gz

    #
    # lipo fuses the two slices into the bundle's existing executable; the greps assert both
    # architectures survived the merge
    #
    - name: '🔗 Lipo arm64 + x86_64 into a universal binary'
      run: |
        APP_EXE="${{env.APPLICATION}}.app/Contents/MacOS/${{env.EXECUTABLE}}"
        X64_EXE="intel-slice/${{env.EXECUTABLE}}-x86_64"
        lipo -create "$APP_EXE" "$X64_EXE" -output "$APP_EXE.universal"
        mv "$APP_EXE.universal" "$APP_EXE"
        chmod +x "$APP_EXE"
        lipo -info "$APP_EXE"
        lipo -info "$APP_EXE" | grep -q "arm64" && lipo -info "$APP_EXE" | grep -q "x86_64"

    #
    # The stamp goes in before codesign: any edit to the bundle afterwards invalidates the
    # signature
    #
    - name: '📝 Stamp packaging metadata (before codesign)'
      run: |
        printf '{"packageType":"dmg","arch":"universal"}\n' \
          > "${{env.APPLICATION}}.app/Contents/Resources/ss-config.json"

    #
    # Loads the Developer ID identity from the p12 secret into the runner keychain
    #
    - name: '🪪 Import Certificates'
      uses: apple-actions/import-codesign-certs@v6
      with:
        p12-file-base64: ${{secrets.APPLE_CERTIFICATES_P12}}
        p12-password: ${{secrets.APPLE_CERTIFICATES_P12_PASSWORD}}

    #
    # --options runtime is what notarization requires; the entitlements are the ones shipped in
    # app/deploy/macOS
    #
    - name: '✍🏻 Sign Application with Entitlements'
      run: |
        codesign --force --deep --options runtime \
          --entitlements "${GITHUB_WORKSPACE}/app/deploy/macOS/Serial-Studio.entitlements" \
          --sign "${{secrets.APPLE_APPID_TEAM_ID}}" \
          "${{env.APPLICATION}}.app"

    #
    # create-dmg builds the release image; LICENSE.md is removed first so it is not folded into
    # the DMG layout
    #
    - name: '💽 Create nice DMG'
      run: |
        npm install --global create-dmg
        rm LICENSE.md
        create-dmg "${{env.APPLICATION}}.app" --dmg-title="${{env.APPLICATION}}"
        mv "${{env.APPLICATION}} ${{env.VERSION}}.dmg" "${{env.EXECUTABLE}}-${{env.VERSION}}-macOS.dmg"

    #
    # --wait blocks on Apple's verdict, so a rejected build fails the job here
    #
    - name: '📋 Notarize'
      shell: bash
      env:
        PRODUCT_PATH: ${{env.EXECUTABLE}}-${{env.VERSION}}-macOS.dmg
        APPLE_ID: ${{secrets.APPLE_NOTARIZATION_USERNAME}}
        APP_PASSWORD: ${{secrets.APPLE_NOTARIZATION_PASSWORD}}
        TEAM_ID: ${{secrets.APPLE_NOTARIZATION_TEAMID}}
      run: |
        echo "Submitting $PRODUCT_PATH for notarization..."
        xcrun notarytool submit "$PRODUCT_PATH" \
          --apple-id "$APPLE_ID" \
          --password "$APP_PASSWORD" \
          --team-id "$TEAM_ID" \
          --wait \
          --output-format json

    #
    # Stapling the ticket lets Gatekeeper clear the DMG on a machine that is offline
    #
    - name: '📌 Staple'
      shell: bash
      run: |
        PRODUCT="${{env.EXECUTABLE}}-${{env.VERSION}}-macOS.dmg"
        echo "Stapling $PRODUCT..."
        xcrun stapler staple "$PRODUCT"

    #
    # Release artifact: the signed, notarized, stapled universal DMG
    #
    - name: '📤 Upload artifact: DMG'
      uses: actions/upload-artifact@v5
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-macOS.dmg
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-macOS.dmg

#-------------------------------------------------------------------------------
# Windows build (MSVC 2022 x86_64)
#-------------------------------------------------------------------------------

  build-windows:
    runs-on: windows-latest
    name: '🧊 Windows Build (x86_64)'
    permissions:
      contents: read
      security-events: write
    steps:
    #
    # core.autocrlf=input keeps the checkout LF-only, which is what code-verify and clang-format
    # assume
    #
    - run: git config --global core.autocrlf input
    #
    # This repo has no submodules; 'submodules: recursive' is a no-op kept for future deps.
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@v5
      with:
        submodules: 'recursive'

    #
    # Restore-only half of the cache pair; the save step below is gated on a miss so a hit never
    # rewrites the entry
    #
    - name: '⚙️ Restore Qt Cache'
      id: qt_cache
      uses: actions/cache/restore@v5
      with:
        path: |
          ${{github.workspace}}/Qt-${{env.QT_VERSION_WINDOWS}}-${{runner.os}}-x64
          ${{env.USERPROFILE}}/.qt-license
        key: qt-${{runner.os}}-${{env.QT_VERSION_WINDOWS}}-x64-msvc2022_64

    #
    # Qt comes from the online installer driven by scripts/install-qt.sh, using the account
    # secrets; only reached when the cache missed
    #
    - name: '⚙️ Install Qt (cache miss)'
      shell: pwsh
      if: steps.qt_cache.outputs.cache-hit != 'true'
      env:
        QT_VERSION: ${{env.QT_VERSION_WINDOWS}}
        QT_ARCH: x64
        QT_USERNAME: ${{secrets.QT_USERNAME}}
        QT_PASSWORD: ${{secrets.QT_PASSWORD}}
        QT_OUTPUT_DIR: ${{github.workspace}}/Qt-${{env.QT_VERSION_WINDOWS}}-${{runner.os}}-x64
      run: |
        ./scripts/install-qt.ps1

    #
    # Writes the entry the restore step looks for, keyed by OS + Qt version + arch
    #
    - name: '⚙️ Save Qt Cache'
      if: steps.qt_cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: |
          ${{github.workspace}}/Qt-${{env.QT_VERSION_WINDOWS}}-${{runner.os}}-x64
          ${{env.USERPROFILE}}/.qt-license
        key: qt-${{runner.os}}-${{env.QT_VERSION_WINDOWS}}-x64-msvc2022_64

    #
    # Publishes bin/, libexec/ and CMAKE_PREFIX_PATH through GITHUB_PATH / GITHUB_ENV so every
    # later step in the job sees the same Qt
    #
    - name: '⚙️ Add Qt to PATH'
      shell: pwsh
      env:
        QT_VERSION: ${{env.QT_VERSION_WINDOWS}}
        QT_OUTPUT_DIR: ${{github.workspace}}/Qt-${{env.QT_VERSION_WINDOWS}}-${{runner.os}}-x64
      run: |
        $QT_BIN_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\bin"
        $QT_LIBEXEC_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\libexec"
        $CMAKE_PREFIX_PATH = "$env:QT_OUTPUT_DIR\$env:QT_VERSION\msvc2022_64\lib\cmake"

        Write-Output "$QT_BIN_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "$QT_LIBEXEC_PATH" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        Write-Output "CMAKE_PREFIX_PATH=$CMAKE_PREFIX_PATH" >> $env:GITHUB_ENV

    #
    # get-cmake supplies a current CMake; both of its caches are off on this image
    #
    - name: '⚙️ Install CMake'
      uses: lukka/get-cmake@latest
      with:
        useLocalCache: false
        useCloudCache: false

    #
    # Sets the x64 MSVC environment that the Ninja generator and clang-cl inherit
    #
    - name: '🛠 Setup MSVC Development Environment'
      uses: TheMrMilchmann/setup-msvc-dev@v4
      with:
        arch: x64

    #
    # The VS-bundled clang-cl is used in preference to any LLVM on PATH, and the step throws
    # rather than silently falling back
    #
    - name: '🛠 Use Microsoft (VS-bundled) clang-cl'
      run: |
        $clangDir = Join-Path $env:VCINSTALLDIR 'Tools\Llvm\x64\bin'
        if (-not (Test-Path (Join-Path $clangDir 'clang-cl.exe'))) { throw "VS clang-cl not found at $clangDir" }
        Add-Content -Path $env:GITHUB_PATH -Value $clangDir
        & (Join-Path $clangDir 'clang-cl.exe') --version

    #
    # gRPC arrives as a prebuilt tarball from GRPC_REPO; building it from source would cost more
    # than the rest of the job put together
    #
    - name: '⚙️ Download prebuilt gRPC'
      run: |
        gh release download v${{env.GRPC_VERSION}} `
          -R ${{env.GRPC_REPO}} `
          -p "grpc-${{env.GRPC_VERSION}}-windows-x86_64.zip"
        mkdir "${{github.workspace}}\grpc-prefix"
        7z x grpc-${{env.GRPC_VERSION}}-windows-x86_64.zip -o"${{github.workspace}}\grpc-prefix"
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}

    #
    # Stage 1 of the two-stage PGO flow: an instrumented Release build whose only job is to emit
    # profiles for the training runs below
    #
    - name: '🚧 Configure with CMake (PGO generate)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_CXX_COMPILER=clang-cl `
          -DCMAKE_C_COMPILER=clang-cl `
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix" `
          -DPRODUCTION_OPTIMIZATION=ON `
          -DENABLE_HARDENING=ON `
          -DENABLE_GRPC=ON `
          -DENABLE_PGO=ON `
          -DPGO_STAGE=GENERATE `
          -DSS_UNITY_BUILD=ON `
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_COMMERCIAL=ON `
          -DBUILD_GPL3=OFF

    #
    # Builds the instrumented binary the two training runs profile
    #
    - name: '🚧 Build application (instrumented)'
      run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

    #
    # Pro widgets are license-gated, so an unactivated training run profiles the wrong code;
    # wrapped in try/catch and exit 0 because an unlicensed profile still beats no profile
    #
    - name: '🔑 Activate Serial Studio license (Pro hotpath training)'
      run: |
        try {
          $p = Start-Process -FilePath "build/app/${{env.EXECUTABLE}}.exe" `
            -ArgumentList '--activate',"${{secrets.SERIAL_STUDIO_LICENSE_KEY}}" `
            -WorkingDirectory $PWD -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
          if ($p.ExitCode -ne 0) { Write-Host "Activation failed (exit $($p.ExitCode)); training without Pro widgets" }
        } catch {
          Write-Host "License activation error: $_"
        }
        exit 0

    #
    # --min-fps 1 turns the benchmark into a profile generator: the real gate runs later, against
    # the optimized binary
    #
    - name: '🏋️ PGO training run (hotpath)'
      run: |
        $p = Start-Process -FilePath "build/app/${{env.EXECUTABLE}}.exe" `
          -ArgumentList '--headless','--benchmark-hotpath','--min-fps','1' `
          -WorkingDirectory $PWD -PassThru -NoNewWindow
        if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'benchmark timed out (no PGO profile)' }

    #
    # continue-on-error: the second profile is a bonus, and this load is the flakiest step in the
    # job on Windows
    #
    - name: '🏋️ PGO training run (big project)'
      continue-on-error: true
      run: |
        ./tests/benchmarks/big_db_test/run_load.ps1 -App "build/app/${{env.EXECUTABLE}}.exe" -Seconds 25

    #
    # Stage 2: identical flags with PGO_STAGE=USE so the compiler consumes the profiles just
    # written
    #
    - name: '🚧 Reconfigure with CMake (PGO use)'
      env:
        ARCGIS_API_KEY: ${{secrets.ARCGIS_API_KEY}}
        SERIAL_STUDIO_LICENSE_KEY: ${{secrets.SERIAL_STUDIO_LICENSE_KEY}}
        SERIAL_STUDIO_INSTANCE_ID: ${{secrets.SERIAL_STUDIO_INSTANCE_ID}}
      run: |
        cmake -B build -G Ninja `
          -DCMAKE_CXX_COMPILER=clang-cl `
          -DCMAKE_C_COMPILER=clang-cl `
          -DCMAKE_PREFIX_PATH="${{github.workspace}}/grpc-prefix" `
          -DPRODUCTION_OPTIMIZATION=ON `
          -DENABLE_HARDENING=ON `
          -DENABLE_GRPC=ON `
          -DENABLE_PGO=ON `
          -DPGO_STAGE=USE `
          -DSS_UNITY_BUILD=ON `
          -DSS_UNITY_BATCH_SIZE=${{ env.SS_UNITY_BATCH }} `
          -DSS_PACKAGE_TYPE=msi `
          -DCMAKE_BUILD_TYPE=Release `
          -DBUILD_COMMERCIAL=ON `
          -DBUILD_GPL3=OFF

    #
    # The binary that ships, and the one every gate below measures
    #
    - name: '🚧 Build application (PGO optimized)'
      run: cmake --build build --config Release -j $env:NUMBER_OF_PROCESSORS

    #
    # The throughput gate reads HOTPATH_PASS out of benchmark.txt: Start-Process loses the child's
    # exit code, so the verdict travels through the file
    #
    - name: '🚦 Hotpath throughput gate (256 kHz)'
      run: |
        $p = Start-Process -FilePath "build/app/${{env.EXECUTABLE}}.exe" `
          -ArgumentList '--headless','--benchmark-hotpath','--min-fps','256000','--benchmark-output','benchmark.txt' `
          -WorkingDirectory $PWD -PassThru -NoNewWindow
        if (-not $p.WaitForExit(300000)) { $p.Kill(); throw 'benchmark timed out' }
        if (Select-String -Path benchmark.txt -Pattern 'HOTPATH_PASS=1' -Quiet) { exit 0 } else { exit 1 }

    #
    # continue-on-error, like the training load it mirrors
    #
    - name: '🩺 Big project verification (optimized)'
      continue-on-error: true
      run: |
        ./tests/benchmarks/big_db_test/run_load.ps1 -App "build/app/${{env.EXECUTABLE}}.exe" -Seconds 15

    #
    # Dumps written by the big_db_test harness itself; always() because the interesting case is
    # the run that failed
    #
    - name: '📦 Upload big_db_test crash dumps'
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: windows-big-db-test-dumps
        path: tests/benchmarks/big_db_test/dumps/
        if-no-files-found: ignore

    #
    # always(): activations are seat-limited, so a failed job still has to release the seat
    #
    - name: '🔑 Deactivate Serial Studio license'
      if: always()
      run: |
        try {
          $p = Start-Process -FilePath "build/app/${{env.EXECUTABLE}}.exe" `
            -ArgumentList '--deactivate' `
            -WorkingDirectory $PWD -PassThru -NoNewWindow
          if (-not $p.WaitForExit(120000)) { $p.Kill() }
        } catch {
          Write-Host "License deactivation error: $_"
        }
        exit 0

    #
    # msbuild is what the WiX toolchain shells out to
    #
    - name: '⚙️ Add msbuild to PATH'
      uses: microsoft/setup-msbuild@v3

    #
    # WiX is the CPack backend for the MSI
    #
    - name: '⚙️ Install WiX'
      run: dotnet tool install --global wix

    #
    # cpack drives WiX; the installer is renamed to the release naming scheme
    #
    - name: '📦 Create MSI installer'
      run: |
        cd build
        cpack --verbose
        mv *.msi ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msi
        mv ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msi ../

    #
    # The same build packaged as a plain archive, the base of the portable ZIP
    #
    - name: '📦 Create portable TGZ'
      run: |
        cd build
        cpack -G TGZ
        mv *.tar.gz ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.tgz

    #
    # Unpacks the TGZ so the portable ZIP can be assembled with a launcher and a license beside it
    #
    - name: '📦 Extract TGZ contents'
      shell: bash
      run: |
        cd build
        7z x ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.tgz
        7z x ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.tar
        DIRNAME=$(tar -tf ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.tar 2>/dev/null | head -1 | cut -f1 -d"/" || true)
        echo $DIRNAME > dirname.txt
        cp ../app/deploy/windows/license.rtf ./License.rtf

    #
    # The deploy tools bundle only the native platform plugin; the integration tests run with
    # QT_QPA_PLATFORM=offscreen
    #
    - name: '🧩 Bundle offscreen platform plugin (headless CI tests)'
      shell: bash
      run: |
        cd build
        DIRNAME=$(cat dirname.txt)
        QT_PLUGINS_PATH="${{github.workspace}}/Qt-${{env.QT_VERSION_WINDOWS}}-${{runner.os}}-x64/${{env.QT_VERSION_WINDOWS}}/msvc2022_64/plugins"
        DEST="$DIRNAME/plugins/platforms"
        mkdir -p "$DEST"
        if [ -f "$QT_PLUGINS_PATH/platforms/qoffscreen.dll" ]; then
          cp "$QT_PLUGINS_PATH/platforms/qoffscreen.dll" "$DEST/"
        else
          echo "Warning: offscreen platform plugin not found at $QT_PLUGINS_PATH/platforms"
        fi

    #
    # Portable entry point: a .bat next to the extracted tree, so users do not have to dig into
    # bin\ for the executable
    #
    - name: '📝 Create Windows batch launcher'
      shell: bash
      run: |
        cd build
        DIRNAME=$(cat dirname.txt)
        echo "@echo off" > "${{env.APPLICATION}}.bat"
        echo "start \"\" \"%~dp0${DIRNAME}\\bin\\${{env.EXECUTABLE}}.exe\"" >> "${{env.APPLICATION}}.bat"

    #
    # Stamps ss-config.json as portable and reads it straight back out of the archive as a check
    #
    - name: '📦 Add files to ZIP'
      shell: bash
      run: |
        cd build
        DIRNAME=$(cat dirname.txt)
        printf '{"packageType":"portable","arch":"x86_64"}\n' > "$DIRNAME/bin/ss-config.json"
        7z a ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows-Portable.zip "${{env.APPLICATION}}.bat" License.rtf $DIRNAME/*
        7z e -so ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows-Portable.zip "$DIRNAME/bin/ss-config.json" | grep -q '"packageType":"portable"'
        mv ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows-Portable.zip ..

    #
    # Store package: the logo variants are rendered from PackageIcon.png onto transparent square
    # canvases, so no plate bleeds behind the icon. The taskbar and the Start "all apps" list read
    # the target-size variants, and they are shipped in their unplated form so Windows draws the
    # bare icon instead of stamping it on the accent-colour plate. resources.pri is what makes
    # those qualified variants resolve at runtime; without the index Windows only sees the neutral
    # logo and plates it. The manifest is generated inline, and makepri/makeappx are located in the
    # installed Windows SDK rather than assumed on PATH
    #
    - name: '📦 Create MSIX package (Microsoft Store)'
      run: |
        $dirname = (Get-Content build/dirname.txt -TotalCount 1).Trim()
        $staging = "build/msix"
        New-Item -ItemType Directory -Force "$staging/Assets" | Out-Null
        Copy-Item -Recurse -Force "build/$dirname/*" $staging
        Set-Content -Path "$staging/bin/ss-config.json" `
          -Value '{"packageType":"msix","arch":"x86_64"}' -Encoding utf8 -NoNewline

        Add-Type -AssemblyName System.Drawing
        $icon = [System.Drawing.Image]::FromFile("$PWD/app/deploy/PackageIcon.png")

        function Save-Logo($size, $name) {
          $bmp = New-Object System.Drawing.Bitmap($size, $size)
          $gfx = [System.Drawing.Graphics]::FromImage($bmp)
          $gfx.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          $gfx.SmoothingMode     = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
          $gfx.DrawImage($icon, 0, 0, $size, $size)
          $bmp.Save("$PWD/$staging/Assets/$name", [System.Drawing.Imaging.ImageFormat]::Png)
          $gfx.Dispose()
          $bmp.Dispose()
        }

        Save-Logo 50  'StoreLogo.png'
        Save-Logo 150 'Square150x150Logo.png'
        Save-Logo 44  'Square44x44Logo.png'

        foreach ($s in 16, 24, 32, 48, 256) {
          Save-Logo $s "Square44x44Logo.targetsize-$s.png"
          Save-Logo $s "Square44x44Logo.targetsize-${s}_altform-unplated.png"
        }
        $icon.Dispose()

        $description = $env:DESCRIPTION -replace '&', '&amp;'
        $manifest = @"
        <?xml version="1.0" encoding="utf-8"?>
        <Package
          xmlns="http://schemas.microsoft.com/appx/manifest/foundation/windows10"
          xmlns:uap="http://schemas.microsoft.com/appx/manifest/uap/windows10"
          xmlns:rescap="http://schemas.microsoft.com/appx/manifest/foundation/windows10/restrictedcapabilities">
          <Identity Name="$($env:MSIX_IDENTITY_NAME)"
                    Publisher="$($env:MSIX_PUBLISHER)"
                    Version="$($env:VERSION).0"
                    ProcessorArchitecture="x64" />
          <Properties>
            <DisplayName>$($env:APPLICATION)</DisplayName>
            <PublisherDisplayName>$($env:MSIX_PUBLISHER_DISPLAY)</PublisherDisplayName>
            <Logo>Assets\StoreLogo.png</Logo>
          </Properties>
          <Dependencies>
            <TargetDeviceFamily Name="Windows.Desktop" MinVersion="10.0.17763.0" MaxVersionTested="10.0.26100.0" />
          </Dependencies>
          <Resources>
            <Resource Language="en-US" />
          </Resources>
          <Applications>
            <Application Id="SerialStudioPro"
                         Executable="bin\$($env:EXECUTABLE).exe"
                         EntryPoint="Windows.FullTrustApplication">
              <uap:VisualElements DisplayName="$($env:APPLICATION)"
                                  Description="$description"
                                  BackgroundColor="transparent"
                                  Square150x150Logo="Assets\Square150x150Logo.png"
                                  Square44x44Logo="Assets\Square44x44Logo.png" />
            </Application>
          </Applications>
          <Capabilities>
            <rescap:Capability Name="runFullTrust" />
          </Capabilities>
        </Package>
        "@
        Set-Content -Path "$staging/AppxManifest.xml" -Value $manifest -Encoding utf8

        $makepri = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makepri.exe" -ErrorAction SilentlyContinue |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $makepri) { throw 'makepri.exe not found in any installed Windows SDK' }
        & $makepri.FullName createconfig /cf "build/priconfig.xml" /dq en-US /o
        if ($LASTEXITCODE -ne 0) { throw "makepri createconfig failed with exit code $LASTEXITCODE" }
        & $makepri.FullName new /pr "$staging" /mn "$staging/AppxManifest.xml" /cf "build/priconfig.xml" /of "$staging/resources.pri" /o
        if ($LASTEXITCODE -ne 0) { throw "makepri new failed with exit code $LASTEXITCODE" }
        Remove-Item "build/priconfig.xml" -Force

        $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\10.*\x64\makeappx.exe" -ErrorAction SilentlyContinue |
          Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $makeappx) { throw 'makeappx.exe not found in any installed Windows SDK' }
        & $makeappx.FullName pack /d $staging /p "${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msix" /o
        if ($LASTEXITCODE -ne 0) { throw "makeappx failed with exit code $LASTEXITCODE" }
        $stamp = & 7z e -so "${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msix" "bin/ss-config.json"
        if ($stamp -notmatch '"packageType":"msix"') { throw 'MSIX ss-config.json stamp mismatch' }

    #
    # Release artifact: the MSI installer
    #
    - name: '📤 Upload artifact: MSI installer'
      uses: actions/upload-artifact@v5
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msi
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msi

    #
    # Release artifact: the portable ZIP
    #
    - name: '📤 Upload artifact: Portable ZIP'
      uses: actions/upload-artifact@v5
      with:
       name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows-Portable
       path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows-Portable.zip

    #
    # Release artifact: the MSIX package uploaded to the Microsoft Store
    #
    - name: '📤 Upload artifact: MSIX package (Store upload)'
      uses: actions/upload-artifact@v5
      with:
        name: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msix
        path: ${{env.EXECUTABLE}}-${{env.VERSION}}-Windows.msix

#-------------------------------------------------------------------------------
# Create release
#-------------------------------------------------------------------------------

  upload:
    name: '🗂 Publish (continuous)'
    needs:
      - build-macos
      - build-linux
      - build-windows
      - build-linux-arm64

    permissions:
      contents: write

    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}

    steps:
      #
      # No submodules: this job only needs the workflow checkout to run gh
      #
      - name: '🧰 Checkout'
        uses: actions/checkout@v5

      #
      # merge-multiple flattens every build job's artifact into one ./artifacts directory
      #
      - name: '📥 Download artifacts'
        uses: actions/download-artifact@v5
        with:
          path: ./artifacts
          merge-multiple: true

      #
      # The continuous release is recreated from scratch on every run; deleting the tag with it
      # keeps the release page from accumulating stale assets
      #
      - name: '🗑️ Delete previous release and tag if exists'
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" &>/dev/null; then
            echo "Release '$RELEASE_TAG' exists. Deleting..."
            gh release delete "$RELEASE_TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || echo "Failed to delete release. Ignoring."
          else
            echo "No release named '$RELEASE_TAG' found. Skipping delete."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      #
      # prerelease + allowUpdates: 'continuous' is a moving target, while a pushed tag publishes
      # under its own name
      #
      - name: '🚀 Create Release'
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.RELEASE_TAG }}
          commit: ${{ github.sha }}
          prerelease: true
          allowUpdates: true
          replacesArtifacts: true
          name: 'Continuous Build'
          artifacts: |
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.rpm
            artifacts/*.dmg
            artifacts/*.msi
            artifacts/*.zip

#-------------------------------------------------------------------------------
# Static analysis (fail-fast, no build)
#-------------------------------------------------------------------------------

  lint:
    runs-on: ubuntu-24.04
    name: '🔬 Lint'
    steps:
    #
    # No submodules: the linters only read first-party sources and scripts
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@v5

    #
    # 3.11 with pip caching: every gate in this job is a Python script
    #
    - name: '🐍 Set up Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    #
    # tests/requirements.txt is the single dependency manifest for the repo's Python tooling
    #
    - name: '🐍 Install Python dependencies'
      run: pip install -r tests/requirements.txt

    #
    # The repo is REUSE-compliant (REUSE.toml + LICENSES/); a file without an SPDX header fails
    # here
    #
    - name: '⚖️ Verify REUSE licensing compliance'
      run: |
        pip install reuse
        reuse lint

    #
    # scripts/code-verify.py is the style contract: errors block the job, advisories do not
    #
    - name: '🔬 Verify code conventions'
      run: python3 scripts/code-verify.py --check

    #
    # The .code-report cleanup checklist, uploaded even on success so the baseline debt stays
    # visible
    #
    - name: '📤 Upload code-verify report'
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: code-verify-report
        path: .code-report
        if-no-files-found: ignore

    #
    # Spec 0037: every drift gate the repo owns has a caller. The snapshot projection is --strict
    # here (locally it warns, because only a build can refresh api-schema.json); its failure
    # message names the ordered fix
    #
    - name: '🧬 Verify generated API surfaces'
      run: |
        python3 scripts/registry-verify.py
        python3 scripts/generate-command-strings.py --check
        python3 scripts/generate-property-registry.py --check
        python3 scripts/generate-property-registry.py --check-snapshot --strict
        python3 scripts/generate-sdk.py --check

#-------------------------------------------------------------------------------
# Integration tests
#-------------------------------------------------------------------------------

  test:
    name: '🧪 Test (${{ matrix.label }})'
    needs: [upload]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux
            os: linux
            runs-on: ubuntu-24.04
            asset: Linux-x64.AppImage
            broker: true
            marker_expr: "not destructive and not dos and not audio"
            timeout_method: signal
          - label: Linux-arm64
            os: linux
            runs-on: ubuntu-24.04-arm
            asset: Linux-arm64.AppImage
            broker: true
            marker_expr: "not destructive and not dos and not audio"
            timeout_method: signal
          - label: macOS
            os: macos
            runs-on: macos-latest
            asset: macOS.dmg
            broker: true
            marker_expr: "not destructive and not dos and not audio"
            timeout_method: signal
          - label: Windows
            os: windows
            runs-on: windows-latest
            asset: Windows-Portable
            broker: false
            marker_expr: "not destructive and not dos and not audio and not requires_broker"
            timeout_method: thread
    runs-on: ${{ matrix.runs-on }}
    defaults:
      run:
        shell: bash
    steps:
    #
    # No submodules: this job runs the pytest suite against a downloaded binary
    #
    - name: '🧰 Checkout'
      uses: actions/checkout@v5

    #
    # Derives the asset name and release tag that the download step below resolves against
    #
    - name: '🧮 Resolve artifact name'
      run: |
        echo "ARTIFACT=${{env.EXECUTABLE}}-${{env.VERSION}}-${{matrix.asset}}" >> "$GITHUB_ENV"
        echo "RELEASE_TAG=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && github.ref_name || 'continuous' }}" >> "$GITHUB_ENV"

    #
    # 3.11 with pip caching: every gate in this job is a Python script
    #
    - name: '🐍 Set up Python'
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
        cache: 'pip'

    #
    # tests/requirements.txt is the single dependency manifest for the repo's Python tooling
    #
    - name: '🐍 Install Python dependencies'
      run: pip install -r tests/requirements.txt

    #
    # The suite runs against the published artifact rather than a local build, so packaging bugs
    # are in scope
    #
    - name: '📥 Download released binary'
      env:
        GH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      run: |
        case "${{matrix.os}}" in
          windows) PATTERN="${ARTIFACT}.zip" ;;
          *)       PATTERN="$ARTIFACT" ;;
        esac
        gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
          --pattern "$PATTERN" --clobber

    #
    # Extracting the AppImage beats running it (no FUSE needed); the apt payload is the runtime
    # the tests exercise: audio, fonts and the broker client
    #
    - name: '📦 Prepare binary (Linux AppImage)'
      if: matrix.os == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libegl1 libgl1 libopengl0 libasound2-dev fontconfig \
          mosquitto mosquitto-clients alsa-utils
        chmod +x "$ARTIFACT"
        ./"$ARTIFACT" --appimage-extract >/dev/null
        echo "SS_RUN=$PWD/squashfs-root/AppRun" >> "$GITHUB_ENV"

    #
    # Mounts the DMG, copies the bundle out, and exports SS_RUN
    #
    - name: '📦 Prepare binary (macOS .app)'
      if: matrix.os == 'macos'
      run: |
        hdiutil attach "$ARTIFACT" -nobrowse -mountpoint /tmp/ssdmg
        cp -R "/tmp/ssdmg/${{env.APPLICATION}}.app" .
        hdiutil detach /tmp/ssdmg
        echo "SS_RUN=$PWD/${{env.APPLICATION}}.app/Contents/MacOS/${{env.EXECUTABLE}}" >> "$GITHUB_ENV"

    #
    # Unzips the portable build and locates the executable inside it
    #
    - name: '📦 Prepare binary (Windows portable)'
      if: matrix.os == 'windows'
      run: |
        7z x "${ARTIFACT}.zip" -oapp_win >/dev/null
        EXE=$(find app_win -name "${{env.EXECUTABLE}}.exe" | head -1)
        echo "SS_RUN=$PWD/$EXE" >> "$GITHUB_ENV"

    #
    # Local broker on 127.0.0.1:1883 for the MQTT tests; the Windows leg has no broker and drops
    # the requires_broker marker instead
    #
    - name: '🦟 Start Mosquitto (Linux)'
      if: matrix.os == 'linux'
      run: |
        sudo systemctl stop mosquitto || true
        printf 'listener 1883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosq.conf
        mosquitto -d -c /tmp/mosq.conf
        for i in $(seq 1 15); do (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break; sleep 1; done

    #
    # Same broker, installed through Homebrew
    #
    - name: '🦟 Start Mosquitto (macOS)'
      if: matrix.os == 'macos'
      run: |
        brew install mosquitto
        printf 'listener 1883 127.0.0.1\nallow_anonymous true\npersistence false\n' > /tmp/mosq.conf
        "$(brew --prefix mosquitto)/sbin/mosquitto" -d -c /tmp/mosq.conf
        for i in $(seq 1 15); do (echo > /dev/tcp/127.0.0.1/1883) >/dev/null 2>&1 && break; sleep 1; done

    #
    # snd-aloop gives the audio driver a capture device; every command is tolerant because the
    # audio leg is non-blocking anyway
    #
    - name: '🎙 Set up ALSA loopback (Linux)'
      if: matrix.os == 'linux'
      run: |
        sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
        sudo modprobe snd-aloop || true
        aplay -l || true

    #
    # Per-OS core-dump and WER configuration, applied before the app starts so a mid-suite crash
    # leaves something to read
    #
    - name: '🧯 Enable crash capture'
      continue-on-error: true
      run: |
        case "${{ matrix.os }}" in
          linux)
            mkdir -p "$GITHUB_WORKSPACE/cores"
            chmod 777 "$GITHUB_WORKSPACE/cores"
            echo "$GITHUB_WORKSPACE/cores/core.%e.%p.%t" | sudo tee /proc/sys/kernel/core_pattern >/dev/null
            sudo systemctl stop apport.service 2>/dev/null || true
            ;;
          macos)
            mkdir -p "$HOME/Library/Logs/DiagnosticReports"
            sudo sysctl -w kern.coredump=1 >/dev/null 2>&1 || true
            sudo chmod 1777 /cores 2>/dev/null || true
            ;;
          windows)
            mkdir -p "$GITHUB_WORKSPACE/crash-dumps"
            DUMP_DIR="$(cygpath -w "$GITHUB_WORKSPACE/crash-dumps")"
            KEY='HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps'
            reg add "$KEY" //v DumpFolder //t REG_EXPAND_SZ //d "$DUMP_DIR" //f
            reg add "$KEY" //v DumpType   //t REG_DWORD      //d 2          //f
            reg add "$KEY" //v DumpCount  //t REG_DWORD      //d 10         //f
            ;;
        esac

    #
    # The --selftest tier runs inside CLI::process(), before the composition root exists
    #
    - name: '🔏 Offline license self-test'
      env:
        QT_QPA_PLATFORM: offscreen
      run: '"$SS_RUN" --selftest-offline-license'

    #
    # Pro surfaces are license-gated; without activation most of the suite would skip
    #
    - name: '🔑 Activate Serial Studio license'
      env:
        QT_QPA_PLATFORM: offscreen
      run: '"$SS_RUN" --activate "${{secrets.SERIAL_STUDIO_LICENSE_KEY}}"'

    #
    # Starts the app with the API server on 7777, waits for the port, and redirects its output to
    # ss_output.log so the assert-scan step below has something to read. The API path policy
    # defaults to home + temp, but the repo corpus the round-trip baseline tests open lives in the
    # workspace (outside home on the Windows runners), so all three roots are allowed explicitly;
    # pytest's tmp_path follows TMPDIR, which on the macOS runners is a private /var/folders tree
    # under neither home nor /tmp, and without it every tmp_path project file is rejected as
    # "filePath is not allowed". SS_ASSERT_NONFATAL is a no-op on the released (Release) binaries,
    # where soft asserts are always nonfatal; it keeps a locally-substituted Debug binary from
    # aborting mid-suite
    #
    - name: '🚀 Start Serial Studio (headless)'
      env:
        QT_QPA_PLATFORM: offscreen
        SERIAL_STUDIO_API_AUTO_CONSENT: '1'
        SS_ASSERT_NONFATAL: '1'
      run: |
        if [ "${{ matrix.os }}" = "windows" ]; then
          export SERIAL_STUDIO_API_ALLOWED_PATHS="$(cygpath -w "$GITHUB_WORKSPACE");$USERPROFILE;$(cygpath -w "$RUNNER_TEMP")"
        else
          ulimit -c unlimited
          export SERIAL_STUDIO_API_ALLOWED_PATHS="$GITHUB_WORKSPACE:$HOME:/tmp:$RUNNER_TEMP:${TMPDIR:-/tmp}"
        fi

        "$SS_RUN" --headless --api-server > ss_output.log 2>&1 &
        echo $! > ss_pid.txt
        for i in $(seq 1 30); do
          (echo > /dev/tcp/127.0.0.1/7777) >/dev/null 2>&1 && { echo "API server ready ($i)"; break; }
          sleep 1
        done

    #
    # Publishing blocks on this suite for tagged builds; continuous builds only report
    # (REQUIRE_TESTS_TO_PUBLISH). timeout-method=signal (POSIX) fails only the hung test and keeps
    # the suite and its junit XML alive, where the ini default (thread) kills the whole pytest
    # process; Windows has no SIGALRM, so it stays on thread, and timeout-minutes is what bounds a
    # fully wedged app now that a hang no longer fast-fails the run
    #
    - name: '🧪 Run tests'
      id: run_tests
      continue-on-error: ${{ env.REQUIRE_TESTS_TO_PUBLISH != 'true' && !startsWith(github.ref, 'refs/tags/') }}
      timeout-minutes: 60
      env:
        PYTHONIOENCODING: utf-8
        PYTHONUTF8: '1'
      run: |
        pytest tests/ \
          --deselect tests/integration/test_licensing.py::test_rapid_status_queries_no_crash \
          -m "${{ matrix.marker_expr }}" \
          --timeout-method=${{ matrix.timeout_method }} \
          -q --tb=line --timeout=60 --junit-xml=test-results.xml

    #
    # Only on a test failure: distinguishes a hang from a crash, and for a hang takes the dump
    # Windows never writes on its own (nothing crashed, so WER produces nothing). comsvcs.dll's
    # MiniDump entry point ships with Windows, so no extra tooling is installed for it
    #
    - name: '🔬 Capture hung app (Windows)'
      if: always() && matrix.os == 'windows' && steps.run_tests.outcome == 'failure'
      continue-on-error: true
      run: |
        mkdir -p crash-reports
        PID="$(cat ss_pid.txt 2>/dev/null)"
        if [ -z "$PID" ]; then
          echo 'no ss_pid.txt; nothing to dump' | tee crash-reports/hang-liveness.txt
          exit 0
        fi
        if kill -0 "$PID" 2>/dev/null; then
          echo "Serial Studio (pid $PID) still ALIVE after test failure -> HANG; dumping" \
            | tee crash-reports/hang-liveness.txt
          WIN_PID="$(powershell -NoProfile -Command "(Get-Process -Id $PID -ErrorAction SilentlyContinue).Id")"
          DUMP="$(cygpath -w "$PWD/crash-reports/hang-full.dmp")"
          powershell -NoProfile -Command \
            "rundll32.exe C:\\Windows\\System32\\comsvcs.dll, MiniDump ${WIN_PID:-$PID} '$DUMP' full" \
            || echo 'MiniDump failed' | tee -a crash-reports/hang-liveness.txt
        else
          echo "Serial Studio (pid $PID) GONE after test failure -> crashed/exited, not a hang" \
            | tee crash-reports/hang-liveness.txt
        fi
        echo '--- captured ---'
        ls -la crash-reports || true

    #
    # macOS counterpart: sample and spindump both capture a live process, so a hang leaves a
    # thread state behind
    #
    - name: '🔬 Capture hung app (macOS)'
      if: always() && matrix.os == 'macos' && steps.run_tests.outcome == 'failure'
      continue-on-error: true
      run: |
        mkdir -p crash-reports
        PID="$(cat ss_pid.txt 2>/dev/null)"
        if [ -z "$PID" ]; then
          echo 'no ss_pid.txt; nothing to sample' | tee crash-reports/hang-liveness.txt
          exit 0
        fi
        if kill -0 "$PID" 2>/dev/null; then
          echo "Serial Studio (pid $PID) still ALIVE after test failure -> HANG; sampling threads" \
            | tee crash-reports/hang-liveness.txt
          sample "$PID" 10 -mayDie -file crash-reports/hang-sample.txt || true
          sudo spindump "$PID" 10 -file crash-reports/hang-spindump.txt >/dev/null 2>&1 || true
        else
          echo "Serial Studio (pid $PID) GONE after test failure -> crashed/exited, not a hang" \
            | tee crash-reports/hang-liveness.txt
        fi
        echo '--- captured ---'
        ls -la crash-reports || true

    #
    # A mid-suite death turns every later test into a connection error, which reads like hundreds
    # of unrelated failures; say so explicitly and show the app's last words, since a clean exit
    # leaves no crash dump behind
    #
    - name: '🩺 Report app liveness after tests'
      if: always()
      continue-on-error: true
      run: |
        PID="$(cat ss_pid.txt 2>/dev/null)"
        if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
          echo "Serial Studio (pid $PID) still running after the suite."
        else
          echo "::warning title=App exited early::Serial Studio (pid ${PID:-unknown}) was gone when the suite ended"
          echo '--- tail of ss_output.log ---'
          tail -n 60 ss_output.log 2>/dev/null || echo '(no ss_output.log)'
        fi

    #
    # The audio marker is excluded from the main run: loopback hardware is not guaranteed on a
    # runner, so this leg reports and never blocks
    #
    - name: '🎙 Run audio loopback tests (Linux, non-blocking)'
      if: matrix.os == 'linux'
      continue-on-error: true
      env:
        QT_QPA_PLATFORM: offscreen
        SS_AUDIO_LOOPBACK_PLAYBACK: plughw:Loopback,1,0
        SS_AUDIO_CAPTURE_MATCH: loopback
      run: |
        pytest tests/integration/test_audio_loopback.py \
          -m audio -q --tb=line --timeout=120 --junit-xml=audio-test-results.xml

    #
    # always(): the seat has to come back even when the suite failed
    #
    - name: '🔑 Deactivate Serial Studio license'
      if: always()
      env:
        QT_QPA_PLATFORM: offscreen
      run: '"$SS_RUN" --deactivate || true'

    #
    # always(): the app is a background process and would otherwise outlive the job
    #
    - name: '🛑 Stop Serial Studio'
      if: always()
      run: '[ -f ss_pid.txt ] && kill $(cat ss_pid.txt) || true'

    #
    # SS_ASSERT reports once per source site through the serialstudio.assert category; surface
    # every site the suite tripped as a workflow annotation (non-blocking) so regressions are
    # visible without digging into artifacts
    #
    - name: '🔎 Scan app output for soft asserts'
      if: always()
      continue-on-error: true
      run: |
        sleep 2
        if [ ! -f ss_output.log ]; then
          echo 'no ss_output.log; nothing to scan'
          exit 0
        fi
        if grep -F 'assertion failed:' ss_output.log > asserts.txt; then
          COUNT=$(wc -l < asserts.txt | tr -d ' ')
          echo "::warning title=SS_ASSERT (${{ matrix.label }})::$COUNT soft-assert site(s) tripped; full app output in pytest-results-${{ matrix.label }} artifact"
          while IFS= read -r line; do
            echo "::warning title=SS_ASSERT::${line}"
          done < asserts.txt
        else
          echo 'No soft asserts in app output.'
        fi

    #
    # Collects whatever the crash-capture step arranged for, per OS
    #
    - name: '🩹 Collect crash reports'
      if: always()
      run: |
        set +e
        mkdir -p crash-reports
        case "${{ matrix.os }}" in
          linux)
            cp -v cores/core.* crash-reports/ 2>/dev/null
            if ls cores/core.* >/dev/null 2>&1; then
              BIN=$(find "$PWD/squashfs-root" -type f \( -name "$UNIXNAME" -o -name "$EXECUTABLE" \) 2>/dev/null | head -1)
              [ -z "$BIN" ] && BIN="$SS_RUN"
              cp -v "$BIN" crash-reports/ 2>/dev/null
              command -v gdb >/dev/null 2>&1 || sudo apt-get install -y gdb >/dev/null 2>&1
              for c in cores/core.*; do
                gdb -batch -ex "thread apply all bt full" "$BIN" "$c" \
                  > "crash-reports/$(basename "$c").backtrace.txt" 2>&1 || true
              done
            fi
            ;;
          macos)
            for i in $(seq 1 8); do
              ls "$HOME/Library/Logs/DiagnosticReports/${EXECUTABLE}"*.ips >/dev/null 2>&1 && break
              sleep 1
            done
            cp -v "$HOME/Library/Logs/DiagnosticReports/${EXECUTABLE}"*.ips   crash-reports/ 2>/dev/null
            cp -v "$HOME/Library/Logs/DiagnosticReports/${EXECUTABLE}"*.crash crash-reports/ 2>/dev/null
            sudo cp -v "/Library/Logs/DiagnosticReports/${EXECUTABLE}"*.ips    crash-reports/ 2>/dev/null
            cp -v /cores/core.* crash-reports/ 2>/dev/null
            ;;
          windows)
            cp -v crash-dumps/*.dmp crash-reports/ 2>/dev/null
            ;;
        esac
        echo '--- crash-reports ---'
        ls -la crash-reports 2>/dev/null || true

    #
    # Guarded on matrix.broker so the Windows leg does not try to kill a broker it never started
    #
    - name: '🦟 Stop Mosquitto'
      if: always() && matrix.broker
      run: pkill -f "mosquitto -d -c /tmp/mosq.conf" || true

    #
    # junit XML plus the app's own output, which the assert scan reads from
    #
    - name: '📤 Upload test results'
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: pytest-results-${{ matrix.label }}
        path: |
          test-results.xml
          audio-test-results.xml
          ss_output.log
          tests/**/*.log

    #
    # Ignored when clean: an empty crash-reports directory is the expected outcome
    #
    - name: '📤 Upload crash reports'
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: crash-reports-${{ matrix.label }}
        path: crash-reports/**
        if-no-files-found: ignore
