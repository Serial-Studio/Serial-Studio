#
# Checks out the private licensed icon art that official builds compile (spec 0116). The art never
# enters this repository, a public artifact, or a log.
#
name: 'Fetch icon art'
description: 'Checks out the private licensed icon art beside the source tree.'

inputs:
  ssh-key:
    description: 'Read-only deploy key for the art repository (secrets.ICON_ART_DEPLOY_KEY).'
    required: true
  repository:
    description: 'Private art repository.'
    required: false
    default: 'Serial-Studio/Icons'
  path:
    description: 'Checkout folder inside the workspace.'
    required: false
    default: 'icon-art'

runs:
  using: 'composite'
  steps:
  - name: 'Check out the art'
    uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
    with:
      repository: ${{inputs.repository}}
      ssh-key: ${{inputs.ssh-key}}
      path: ${{inputs.path}}
      persist-credentials: false
