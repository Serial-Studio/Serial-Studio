#
# The post-link layout stage of the Linux release flow (spec 0090). Takes the PGO-optimized,
# still-unstripped binary, instruments it with LLVM BOLT, re-runs the same two training loads
# the PGO flow used (the license seat is already active from pgo-train-linux; the job's
# always() step releases it), rewrites the binary from the merged profile -- BOLT itself
# performs the spec-0084 hardening strip (-remove-symtab) because objcopy/strip corrupt a
# rewritten ELF -- and cuts the spec-0084 sidecar from a debug-rich twin rewrite. Every step
# is fail-hard: there is no fallback to the un-rewritten binary (spec R3).
#

name: 'Post-link layout (Linux BOLT)'
description: 'Instruments, trains, and rewrites the PGO-optimized binary with LLVM BOLT, then finalizes it.'

inputs:
  app:
    description: 'Path to the PGO-optimized executable (unstripped, linked with --emit-relocs).'
    required: true
  qt-lib-dir:
    description: 'Qt library directory placed on LD_LIBRARY_PATH for the training runs.'
    required: true
  bolt-version:
    description: 'Pinned LLVM BOLT major (apt.llvm.org bolt-<N> package; built for amd64 and arm64).'
    required: false
    default: '21'

runs:
  using: 'composite'
  steps:
  #
  # apt.llvm.org, not the Ubuntu archive: noble's bolt-18 is amd64-only AND predates the
  # llvm/llvm-project#98992 fragment-matching fix our prebuilt gRPC needs (its GCC .cold
  # fragments carry duplicated local symbols, which older BOLT cannot map to a parent).
  # The upstream repo ships bolt-<N> for both release arches; a missing package is a loud
  # failure, never a skipped stage
  #
  - name: '⚙️ Install LLVM BOLT'
    shell: bash
    env:
      BOLT_V: ${{inputs.bolt-version}}
    run: |
      set -euo pipefail
      CODENAME="$(. /etc/os-release && echo "$VERSION_CODENAME")"
      wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key \
        | sudo gpg --dearmor -o /usr/share/keyrings/apt-llvm-org.gpg
      echo "deb [signed-by=/usr/share/keyrings/apt-llvm-org.gpg] http://apt.llvm.org/${CODENAME}/ llvm-toolchain-${CODENAME}-${BOLT_V} main" \
        | sudo tee /etc/apt/sources.list.d/apt-llvm-org.list
      sudo apt-get update -qq
      sudo apt-get install -y --no-install-recommends "bolt-${BOLT_V}"
      "llvm-bolt-${BOLT_V}" --version

  #
  # The prebuilt gRPC archive carries GCC-split .cold fragments whose parent symbols the
  # archive's own link folded away (ICF); BOLT's fragment registration hard-fails on any
  # orphan fragment regardless of -skip-funcs. Dropping exactly those symbols leaves the
  # code in place, anonymous and unoptimized -- fine for never-executed crash paths -- and
  # the DWARF sidecar is untouched. Generic by construction so a gRPC bump cannot re-break it
  #
  - name: '🔩 Drop orphan .cold fragment symbols'
    shell: bash
    env:
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      nm --no-demangle "$SS_APP" | awk 'NF >= 3 {print $3}' | sort -u > bolt-symtab.txt
      args=()
      while IFS= read -r frag; do
        parent="${frag%.cold*}"
        if ! grep -qxF "$parent" bolt-symtab.txt; then
          echo "orphan fragment, dropping symbol: $frag"
          args+=("--strip-symbol=$frag")
        fi
      done < <(grep -E '\.cold(\.[0-9]+)?$' bolt-symtab.txt || true)
      if [ "${#args[@]}" -gt 0 ]; then
        objcopy "${args[@]}" "$SS_APP"
      fi
      rm -f bolt-symtab.txt

  #
  # Instrumentation mode, not sampling: hosted runners expose no PMU/LBR. Periodic dumping is
  # incompatible with per-pid profile names (append-pid dumps only at exit), so every process
  # writes the one bolt-prof.fdata and each training step renames it aside when done.
  # skip-funcs excludes LuaJIT's hand-written VM (one asm function, lj_BC_ISLT + every lj_*
  # entry, built on asm-level jump tables): BOLT's unreachable-block elimination strips blocks
  # those tables still target and emission dies with undefined .Ltmp labels on aarch64 -- and
  # re-laying hand-tuned interpreter asm has no upside on any arch
  #
  - name: '🔩 Instrument binary with BOLT'
    shell: bash
    env:
      BOLT_V: ${{inputs.bolt-version}}
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      "llvm-bolt-${BOLT_V}" "$SS_APP" -o "${SS_APP}.inst" \
        --instrument \
        --instrumentation-file="$PWD/bolt-prof.fdata" \
        --instrumentation-sleep-time=5 \
        --instrumentation-no-counters-clear \
        --skip-funcs='lj_BC_ISLT.*'

  #
  # Same two loads as pgo-train-linux, against the instrumented copy. The BOLT runtime dumps
  # the cumulative profile every 5 s (sleep-time + no-counters-clear above), so a trainer
  # crash in the runtime's exit-path dump -- a known aarch64 fragility in binaries hosting a
  # JIT (llvm/llvm-project#126000) -- loses only the final seconds of counters. The trainer's
  # exit code is therefore advisory; what gates is that each run grew the profile set, plus
  # the merge/rewrite/self-test/throughput steps downstream (spec R3 stays fail-hard: there
  # is still no path that ships the un-rewritten binary)
  #
  - name: '🏋️ BOLT training run (hotpath)'
    shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      LD_LIBRARY_PATH: ${{inputs.qt-lib-dir}}
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      set +e
      "${SS_APP}.inst" --headless --benchmark-hotpath --min-fps 1 --benchmark-output bolt-train.txt
      rc=$?
      set -e
      test -s bolt-prof.fdata
      mv bolt-prof.fdata bolt-prof.fdata.hotpath
      if [ "$rc" -ne 0 ]; then
        echo "::warning::instrumented trainer exited ${rc} after dumping a profile (BOLT runtime teardown; tolerated)"
      fi

  - name: '🏋️ BOLT training run (big project)'
    shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      LD_LIBRARY_PATH: ${{inputs.qt-lib-dir}}
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      set +e
      bash tests/benchmarks/big_db_test/run_load.sh "${SS_APP}.inst" 25
      rc=$?
      set -e
      test -s bolt-prof.fdata
      mv bolt-prof.fdata bolt-prof.fdata.big
      if [ "$rc" -ne 0 ]; then
        echo "::warning::instrumented trainer exited ${rc} after dumping a profile (BOLT runtime teardown; tolerated)"
      fi

  #
  # An empty merge means the training produced no profile, which rewrites the binary blind --
  # fail here, loudly, instead (spec R3)
  #
  - name: '🔗 Merge BOLT profiles'
    shell: bash
    env:
      BOLT_V: ${{inputs.bolt-version}}
    run: |
      set -euo pipefail
      ls bolt-prof.fdata.* 1>/dev/null
      "merge-fdata-${BOLT_V}" bolt-prof.fdata.* > bolt-merged.fdata
      test -s bolt-merged.fdata

  #
  # ext-tsp block layout + cdsort function order + BOLT's own hot/cold splitting (which replaces
  # the GCC splitting the build disabled for it). BOLT is the ONLY writer of the shipping
  # binary: objcopy and strip corrupt a BOLT-rewritten ELF (llvm/llvm-project#89336), so the
  # shipping rewrite lets BOLT itself drop the debug info, the --emit-relocs payload (it strips
  # non-allocatable RELA sections unconditionally) and the symbol table (-remove-symtab, the
  # spec-0084 hardening strip). The second rewrite is a layout-identical debug-rich twin
  # (-update-debug-sections) that exists only for the sidecar cut below and never ships.
  # dyno-stats is the per-release audit artifact (spec R8)
  #
  - name: '🔩 Rewrite binary layout (BOLT)'
    shell: bash
    env:
      BOLT_V: ${{inputs.bolt-version}}
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      "llvm-bolt-${BOLT_V}" "$SS_APP" -o "${SS_APP}.bolt" \
        -data=bolt-merged.fdata \
        -reorder-blocks=ext-tsp \
        -reorder-functions=cdsort \
        -split-functions \
        -split-all-cold \
        -skip-funcs='lj_BC_ISLT.*' \
        -remove-symtab \
        -dyno-stats 2>&1 | tee bolt-report.txt
      "llvm-bolt-${BOLT_V}" "$SS_APP" -o "${SS_APP}.sym" \
        -data=bolt-merged.fdata \
        -reorder-blocks=ext-tsp \
        -reorder-functions=cdsort \
        -split-functions \
        -split-all-cold \
        -skip-funcs='lj_BC_ISLT.*' \
        -update-debug-sections
      rm -f "${SS_APP}.inst"

  #
  # The deferred spec-0084 finalize, reduced to the sidecar cut: objcopy only READS the
  # debug-rich twin to write the .debug file, so the shipping binary is never post-processed.
  # The readelf probes prove the shipping binary is the BOLT output (BOLT always stamps
  # .note.bolt_info) and the sidecar actually carries line tables before the swap. After
  # this step the binary is the one every gate measures and every package ships
  #
  - name: '🔩 Finalize binary (sidecar split)'
    shell: bash
    env:
      SS_APP: ${{inputs.app}}
    run: |
      set -euo pipefail
      readelf -x .note.bolt_info "${SS_APP}.bolt" 1>/dev/null
      objcopy --only-keep-debug "${SS_APP}.sym" "${SS_APP}.debug"
      readelf -S "${SS_APP}.debug" | grep -q "\.debug_line"
      mv -f "${SS_APP}.bolt" "$SS_APP"
      chmod +x "$SS_APP"
      rm -f "${SS_APP}.sym"
