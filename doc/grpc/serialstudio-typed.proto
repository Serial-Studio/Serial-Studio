  // Update a register (params: table, name, newName?, computed?, defaultValue?)
  rpc ProjectDataTableUpdateRegister(ProjectDataTableUpdateRegisterRequest) returns (CommandResponse);

  // Add a dataset to a group. A dataset is one channel of incoming data: it gets one column in CSV/MDF4 export, one entry in the frame parser's output array (its `index` field), and zero or more dashboard widgets driven by the `options` bitflags.
  // Pass `options` as the bitwise OR of the visualizations you want:
  //   1 = Plot (time-series line)
  //   2 = FFT (frequency-domain plot)
  //   4 = Bar
  //   8 = Gauge (radial dial; needs widgetMin/widgetMax)
  //   16 = Compass (heading 0-360)
  //   32 = LED (binary indicator with ledHigh threshold)
  //   64 = Waterfall (Pro; spectrogram, FFT-driven)
  //   0 = no widget (raw column for export only)
  // Combine: 1|8 = 9 = plot AND gauge. After creation, set title, units, ranges, and transformCode via project.dataset.update.
  rpc ProjectDatasetAdd(ProjectDatasetAddRequest) returns (CommandResponse);

  // Bulk-create N datasets in one call -- the right tool whenever you would otherwise loop project.dataset.add. Avoids per-call overhead and the autosave-debounce churn that comes with rapid mutation bursts. After creation, individual datasets can still be patched with project.dataset.update or another project.batch round-trip.
  //   count          -- how many datasets to create (1..1024).
  //   options        -- visualization bitfield (same as project.dataset.add).
  //   titlePattern   -- optional, e.g. 'LED {n}'. {n} is replaced with the running counter (startNumber + i), {i} with the zero-based index. Omit to keep the auto-generated title from project.dataset.add.
  //   startNumber    -- optional, default 1; first {n} value.
  //   startIndex     -- optional, default -1 (auto-assign next free parser slot). Pass 0 to leave index unset, or 1+ to assign consecutive parser slots starting from there.
  // Returns {count, created: [{datasetId, title, index, uniqueId}...]}.
  rpc ProjectDatasetAddMany(ProjectDatasetAddManyRequest) returns (CommandResponse);

  // Delete a dataset by id. Pass dryRun:true to preview the renumbering without committing -- the response carries the same {deleted, renumbered, warnings} shape as a real call, plus a top-level dryRun:true flag. Always preview before committing when destructive intent is even slightly uncertain.
  rpc ProjectDatasetDelete(ProjectDatasetDeleteRequest) returns (CommandResponse);

  // Duplicate a dataset by id (params: groupId, datasetId)
  rpc ProjectDatasetDuplicate(ProjectDatasetDuplicateRequest) returns (CommandResponse);

  // Returns the dataset's coloured alarm bands as a JSON array. Each entry: {min, max, severity (0=Info, 1=OK, 2=Warning, 3=Critical), color ("#rrggbb" override or empty for severity default), label, blink}. Also returns rangeMin/rangeMax (the dataset's wgtMin/wgtMax) so callers can validate band ranges before writing back. An empty array means no alarms configured. Applies to bar / gauge / meter widgets and LED-panel datasets; calling on other widget types succeeds with an empty array.
  rpc ProjectDatasetGetAlarmBands(ProjectDatasetGetAlarmBandsRequest) returns (CommandResponse);

  // Resolve a dataset by title path. Preferred for human-readable addressing -- survives uniqueId reordering.
  rpc ProjectDatasetGetByPath(ProjectDatasetGetByPathRequest) returns (CommandResponse);

  // Resolve a dataset by exact title. Pass sourceId / groupId to disambiguate when titles repeat across groups.
  rpc ProjectDatasetGetByTitle(ProjectDatasetGetByTitleRequest) returns (CommandResponse);

  // Resolve a dataset by its uniqueId (number) or alias (string). Returns the same shape as the elements of project.dataset.list.
  rpc ProjectDatasetGetByUniqueId(ProjectDatasetGetByUniqueIdRequest) returns (CommandResponse);

  // Returns the order datasets execute in during transform processing. Useful for debugging cross-dataset transforms (a transform reads final values only for datasets earlier in this list). Large projects: pass offset/limit to page (each row carries its absolute `position`; reply carries window/nextOffset/projectEpoch).
  rpc ProjectDatasetGetExecutionOrder(ProjectDatasetGetExecutionOrderRequest) returns (CommandResponse);

  // Returns the dataset's FFT frequency markers as a JSON array. Each entry: {freq (Hz), endFreq (optional; present only for band markers), label, color ("#rrggbb" override or empty for the theme accent), warningDb, alarmDb (optional display-dB thresholds; omitted when unset)}. Also returns nyquist (fftSamplingRate / 2) so callers can validate frequencies before writing back. An empty array means no markers configured.
  rpc ProjectDatasetGetFFTMarkers(ProjectDatasetGetFFTMarkersRequest) returns (CommandResponse);

  // List all datasets across all groups. Large projects: pass offset/limit to page the flattened dataset array (reply carries window/nextOffset/projectEpoch); datasetCount always reflects the whole project. Prefer project.search to find datasets by partial name.
  rpc ProjectDatasetList(ProjectDatasetListRequest) returns (CommandResponse);

  // Reorder a dataset within its group. Changes datasetId (and therefore uniqueId) for the moved dataset and any it crossed; workspace refs re-anchor automatically. Scripts that pinned a uniqueId must be updated -- prefer dataset.getByPath in scripts. Pass dryRun:true to preview the renumbering without committing.
  rpc ProjectDatasetMove(ProjectDatasetMoveRequest) returns (CommandResponse);

  // Atomically replaces the dataset's alarmBands array. Each band entry must provide numeric min and max (max>min; bands with max<=min are silently dropped and counted in result.droppedInvalid), and an integer severity (0=Info, 1=OK, 2=Warning, 3=Critical). color is optional ("#rrggbb" override; empty/missing = severity's theme colour). label is optional (surfaces in band-edge notifications). blink is optional (boolean; LED panels flash the LED while the band is active). Bands may have gaps and may overlap; rendering paints them in array order behind the value indicator. Severity >= Warning triggers a notification when the value enters the band, even when no widget is visible (3-second per-dataset cooldown suppresses oscillation spam).
  // Pass an empty array to clear all alarms.
  rpc ProjectDatasetSetAlarmBands(ProjectDatasetSetAlarmBandsRequest) returns (CommandResponse);

  // Atomically replaces the dataset's fftMarkers array (FFT plot + waterfall frequency markers). Each entry must provide a finite freq > 0 in Hz; invalid entries are silently dropped and counted in result.droppedInvalid. endFreq is optional (> freq turns the marker into a band; otherwise it is a point marker). label and color ("#rrggbb") are optional. warningDb and alarmDb are optional display-dB thresholds evaluated against the rendered spectrum; when both are present and reversed they are swapped. Pass an empty array to clear all markers.
  rpc ProjectDatasetSetFFTMarkers(ProjectDatasetSetFFTMarkersRequest) returns (CommandResponse);

  // DEPRECATED -- prefer project.dataset.setOptions, which takes the full bitfield in one call and removes the singular/plural ambiguity. Kept for backward compatibility with existing scripts. Toggles one DatasetOption flag on a dataset and updates the group's compatibleWidgetTypes immediately. option values (DatasetOption bitflag): 1=Plot, 2=FFT, 4=Bar, 8=Gauge, 16=Compass, 32=LED, 64=Waterfall (Pro). Bar/Gauge/Compass are mutually exclusive. NOTE: this is a DatasetOption bitflag, NOT a DashboardWidget enum -- the numbers do not line up with project.workspace.addWidget's widgetType.
  rpc ProjectDatasetSetOption(ProjectDatasetSetOptionRequest) returns (CommandResponse);

  // Apply several DatasetOption flags at once (plural form of project.dataset.setOption). Pass `options` as the bitwise OR of the flags you want enabled; any flag NOT set in the value is disabled. Bits: 1=Plot, 2=FFT, 4=Bar, 8=Gauge, 16=Compass, 32=LED, 64=Waterfall (Pro). Bar/Gauge/Compass are mutually exclusive -- if more than one is set, the highest bit wins. Updates the group's compatibleWidgetTypes immediately. NOTE: these are DatasetOption bitflags, NOT DashboardWidget enum values -- the numbers do not line up with project.workspace.addWidget's widgetType.
  rpc ProjectDatasetSetOptions(ProjectDatasetSetOptionsRequest) returns (CommandResponse);

  // Set dataset transformCode. Empty clears. Pass `language` whenever you author code so the dataset's transformLanguage matches the syntax you wrote -- mismatches compile-fail silently. Lua (1) is the recommended default; it's measurably faster than JavaScript on hot transforms. If this dataset is compute-only (no slot in the parser output array), also set virtual=true via project.dataset.setVirtual or project.dataset.update. Validate with project.dataset.transform.dryRun before setting. **Call meta.fetchScriptingDocs{kind: 'transform_lua' | 'transform_js'} first** for the transform(value) signature, table API (tableGet/tableSet/datasetGetRaw/datasetGetFinal), and execution-order rules -- a transform may read RAW values from any dataset but only FINAL values of datasets earlier in project.dataset.getExecutionOrder.
  rpc ProjectDatasetSetTransformCode(ProjectDatasetSetTransformCodeRequest) returns (CommandResponse);

  // Toggle the virtual flag on a dataset (params: groupId, datasetId, virtual)
  rpc ProjectDatasetSetVirtual(ProjectDatasetSetVirtualRequest) returns (CommandResponse);

  // Compile and execute a value-transform script against one or more sample inputs WITHOUT touching the live project. Returns the per-input transform output or compile errors. Params: code (string), language (0=JS, 1=Lua), values (array of numbers or strings).
  rpc ProjectDatasetTransformDryRun(ProjectDatasetTransformDryRunRequest) returns (CommandResponse);

  // Patch dataset fields by id: params are groupId, datasetId, plus any of the writable fields declared in this command's schema -- read the typed 'properties' block for each field's type, description and enum domain instead of guessing from prose.
  // Fields whose project-file spelling differs from the API name (plotMin, plotMax, widgetMin, widgetMax, xAxis, datasetSourceId) are accepted as aliases, so an object read back from the API can be written straight through without loss.
  // Nested collections: alarmBands takes an array of {min,max,severity,color,label,blink} objects (severity=0..3 for Info/Ok/Warning/Critical), and legacy alarmLow/alarmHigh/alarmEnabled still drive the 2-band simple mode; fftMarkers takes an array of {freq,endFreq,label,color,warningDb,alarmDb} objects (see project.dataset.setFFTMarkers for field semantics).
  // The boolean fields graph/fft/led/waterfall toggle the same flags as project.dataset.setOption -- use them here when patching multiple fields at once. Multiplot groups follow the group's FIRST dataset for plotLogX/plotLogY, so set those flags on every member to keep the group coherent.
  // Unknown fields are accepted but ignored, and surfaced in result.warnings[].fields with code 'unknown_field' so the caller can self-correct on the next turn instead of silently mis-applying a typo.
  // REMINDERS for compute-only datasets:
  //   - Set virtual=true when the dataset's value comes from transformCode rather than from a slot in the parser output. Without virtual=true the dataset still tries to read channels[index-1] and ends up empty.
  //   - `index` is the 1-based parser-output slot (0 = unassigned). Patchable via this call; bulk-renumbering 40 datasets is best done through project.batch to avoid round-trip overhead.
  //   - Set transformLanguage explicitly (0=JavaScript, 1=Lua, -1=inherit from source). Mismatched language vs code = silent compile failure. Lua is the recommended default; it's faster on the hotpath.
  rpc ProjectDatasetUpdate(ProjectDatasetUpdateRequest) returns (CommandResponse);

  // End-to-end dry run: takes a sample frame body, runs the project's frame parser, then applies every dataset's transform in execution order, and returns the final per-dataset values WITHOUT touching live state. Required: sampleFrame (single body) OR sampleFrames (array of bodies); everything else defaults to the live project. Use this to verify the full parse->transform pipeline before issuing setCode/setTransformCode. Note: the table API (tableGet/tableSet/datasetGetRaw/datasetGetFinal) is NOT injected; transforms that depend on it should be tested with project.dataset.transform.dryRun individually.
  rpc ProjectDryRunEndToEnd(ProjectDryRunEndToEndRequest) returns (CommandResponse);

  // Export project as JSON
  rpc ProjectExportJson(ProjectExportJsonRequest) returns (CommandResponse);

  // Compile-only check for a frame parser. Catches syntax errors and the 'wrong-language' silent failure (e.g. Lua code passed with language=0). Returns {ok, error?, warning?} without executing the parser. Cheap; use before frameParser.setCode when authoring.
  rpc ProjectFrameParserDryCompile(ProjectFrameParserDryCompileRequest) returns (CommandResponse);

  // Compile and execute frame parser code against raw stream bytes WITHOUT touching the live project. Drives the full pipeline: extraction (delimiters / detection) -> decoder switch -> parse(). Identical code path to the live FrameBuilder and the frame parser test dialog. Required: code, language, inputBytesHex (preferred; binary-safe) or inputBytes (UTF-8 text). Recommended: decoderMethod + frameDetection + frameStart / frameEnd + checksumAlgorithm, otherwise sensible defaults apply (PlainText, EndDelimiterOnly, no delimiters, no checksum). Returns per-frame raw / decoder / rows plus extractedCount / consumedBytes / remainingBytes / droppedFrames. For binary protocols (COBS, Modbus, custom binary) pick decoderMethod=3 (Binary); the text decoders run through QString::fromUtf8 and corrupt non-ASCII bytes.
  rpc ProjectFrameParserDryRun(ProjectFrameParserDryRunRequest) returns (CommandResponse);

  // Read the current frame parser source for a given data source. Returns {code, language}; Built-In sources also return {template, params} and `code` carries the JSON descriptor. Always read BEFORE rewriting -- preserve the user's existing structure where reasonable.
  rpc ProjectFrameParserGetCode(ProjectFrameParserGetCodeRequest) returns (CommandResponse);

  // Get frame parser configuration
  rpc ProjectFrameParserGetConfig(ProjectFrameParserGetConfigRequest) returns (CommandResponse);

  // Get the script language used by the frame parser for a given source
  rpc ProjectFrameParserGetLanguage(ProjectFrameParserGetLanguageRequest) returns (CommandResponse);

  // Get the Built-In frame parser configuration for a source. Returns {sourceId, language, template, params}; template is empty when the source never used the Built-In language.
  rpc ProjectFrameParserGetTemplate(ProjectFrameParserGetTemplateRequest) returns (CommandResponse);

  // Get the parameter schema of a Built-In frame parser template. Returns {id, name, description, params: [{key, type, label, description, default, options?, min?, max?}]}. Param types: string, char, int, float, bool, enum (enum values come from options[].value).
  rpc ProjectFrameParserGetTemplateSchema(ProjectFrameParserGetTemplateSchemaRequest) returns (CommandResponse);

  // List the Built-In (C++) frame parser templates. Returns {templates: [{id, name, description}], count}. Built-In templates parse without user code and are the fastest option; configure one with project.frameParser.setTemplate after inspecting its parameters via project.frameParser.getTemplateSchema.
  rpc ProjectFrameParserListTemplates(ProjectFrameParserListTemplatesRequest) returns (CommandResponse);

  // Set frame parser code (params: code, optional sourceId, optional language). Always pass `language` when authoring code to lock in the runtime engine -- mismatch = silent compile failure. Lua (1) is the recommended default; it's faster than JavaScript on the hotpath at typical telemetry rates. Use JavaScript only when you need a JS-specific library or feature. Validate with project.frameParser.dryRun (or dryCompile for a syntax-only check) before setCode. **Call meta.fetchScriptingDocs{kind: 'frame_parser_lua' | 'frame_parser_js'} first** for the parse() signature, return-shape rules, and the tableGet/tableSet API. For Built-In (2), prefer project.frameParser.setTemplate; passing the JSON descriptor as `code` also works.
  rpc ProjectFrameParserSetCode(ProjectFrameParserSetCodeRequest) returns (CommandResponse);

  // Switch a source between JavaScript, Lua and Built-In frame parsers. WARNING: for JS/Lua this WIPES any existing frameParser code for that source -- the loaded default template for the new language replaces it. If you want to preserve+translate, frameParser.getCode first, switch, then frameParser.setCode with the translated source. Switching to Built-In (2) seeds the default 'delimited' template and leaves JS/Lua code intact for round-trips.
  rpc ProjectFrameParserSetLanguage(ProjectFrameParserSetLanguageRequest) returns (CommandResponse);

  // Select a Built-In frame parser template for a source and switch the source to the Built-In language. Params are validated against the template schema; omitted params use the schema defaults. Use project.frameParser.dryRun (language 2, descriptor as code) to preview the output before or after applying.
  rpc ProjectFrameParserSetTemplate(ProjectFrameParserSetTemplateRequest) returns (CommandResponse);

  // Configure frame extraction settings on a source (params: startSequence, endSequence, checksumAlgorithm, frameDetection, decoderMethod, hexadecimalDelimiters, operationMode). This is the persist path for delimiters -- parser code alone (setCode) never changes them.
  rpc ProjectFrameParserUpdate(ProjectFrameParserUpdateRequest) returns (CommandResponse);

  // Returns top-level project state: title, file path, modified flag, operation mode (ProjectFile/ConsoleOnly/QuickPlot), counts of groups/datasets/sources/actions/workspaces. Useful as a sanity check before destructive operations.
  rpc ProjectGetStatus(ProjectGetStatusRequest) returns (CommandResponse);

  // Create a new visualization group. Pick widgetType by data shape:
  //   - 5 (NoGroupWidget): just hold related datasets together; per-dataset widgets render individually. Default for arbitrary scalar data.
  //   - 4 (MultiPlot): N values plotted on a shared time axis. The right choice for correlated signals (sensor-array, multi-channel ADC).
  //   - 0 (DataGrid): tabular numeric readout. Good for long lists of scalars where graphing isn't useful.
  //   - 1/2/3 (Accelerometer / Gyroscope / GPS): typed 3-axis IMU or GPS group. Datasets must follow conventional widget tags ("x", "y", "z" for IMUs; "lat", "lon", "alt" for GPS).
  //   - 6 (Plot3D, Pro): 3D point trail from three datasets.
  //   - 7 (ImageView, Pro): displays an embedded JPEG/PNG stream.
  //   - 8 (Painter, Pro): user-scripted JS canvas. Group can be EMPTY (no datasets) and read peer datasets via datasetGetFinal(uniqueId). See meta.howTo('add_painter').
  // Don't pick 0 / DataGrid as a default -- it makes a forgettable table. Match the user's data.
  rpc ProjectGroupAdd(ProjectGroupAddRequest) returns (CommandResponse);

  // Delete a group by id. Pass dryRun:true to preview what would change without committing -- the response contains the same {deleted, renumbered, warnings} fields as a real call, plus a top-level dryRun:true flag. Always preview before committing when the user doesn't have a backup workflow.
  rpc ProjectGroupDelete(ProjectGroupDeleteRequest) returns (CommandResponse);

  // Duplicate a group by id (params: groupId)
  rpc ProjectGroupDuplicate(ProjectGroupDuplicateRequest) returns (CommandResponse);

  // Read one group plus a compact dataset summary (datasetId, uniqueId, index, title, units) without pulling the whole project. Address it by EITHER the positional groupId (what group.update / dataset CRUD take) OR the stable uniqueId (what workspace widget refs carry under the key 'groupId'); the response returns both ids. The summary pages via offset/limit (default 50, max 200).
  rpc ProjectGroupGet(ProjectGroupGetRequest) returns (CommandResponse);

  // List all groups with dataset counts. Large projects: pass offset/limit to page (reply carries window/nextOffset/projectEpoch); groupCount always reflects the whole project. Prefer project.search to find a group by name and project.group.get to inspect one group.
  rpc ProjectGroupList(ProjectGroupListRequest) returns (CommandResponse);

  // Reorder a group within the project. Changes groupId for the moved group and any it crossed (which propagates to dataset uniqueIds). Workspace refs re-anchor automatically; scripts pinning a uniqueId must be updated. Pass dryRun:true to preview the renumbering.
  rpc ProjectGroupMove(ProjectGroupMoveRequest) returns (CommandResponse);

  // Patch group fields by id (params: groupId, plus any of title, widget, columns, sourceId, painterCode). Unknown fields are accepted but ignored, and surfaced in result.warnings[].fields with code 'unknown_field'.
  rpc ProjectGroupUpdate(ProjectGroupUpdateRequest) returns (CommandResponse);

  // Replace the current project with a JSON object IN MEMORY (no file association). Use when you have a project shape ready to install -- e.g. building a project from scratch in one shot, or implementing a custom template. The JSON shape must match the .ssproj schema (top-level: title, frameStart, frameEnd, frameDetection, decoder, frameParser, groups, actions, ...). Prefer project.template.apply for canned starters. Pass dryRun:true to return wouldDiscard + wouldApply summaries without loading.
  rpc ProjectLoadJson(ProjectLoadJsonRequest) returns (CommandResponse);

  // Read the MQTT publisher configuration (broker, mode, TLS, etc.). The password is NEVER returned -- inspect 'hasCredentials' instead. Use 'modes', 'mqttVersions', 'sslProtocols', 'peerVerifyModes' as the canonical enum tables when interpreting the integer fields.
  rpc ProjectMqttPublisherGetConfig(ProjectMqttPublisherGetConfigRequest) returns (CommandResponse);

  // Snapshot publisher live state (connected, messagesSent, broker endpoint). Does NOT trigger a new connection attempt.
  rpc ProjectMqttPublisherGetStatus(ProjectMqttPublisherGetStatusRequest) returns (CommandResponse);

  // Patch one or more MQTT publisher fields. Pass only the keys you want to change. Setting 'password' requires 'username' in the same call -- the credential pair is persisted to the encrypted vault, NOT to the project file. To clear credentials, pass empty strings for both. Setting 'enabled:true' starts publishing.
  rpc ProjectMqttPublisherSetConfig(ProjectMqttPublisherSetConfigRequest) returns (CommandResponse);

  // Read the MQTT subscriber driver configuration (the UI driver -- this matches what would be used the next time io.connect runs with busType=mqtt). Password is never returned.
  rpc ProjectMqttSubscriberGetConfig(ProjectMqttSubscriberGetConfigRequest) returns (CommandResponse);

  // Snapshot subscriber driver live state (isOpen, hostname, port).
  rpc ProjectMqttSubscriberGetStatus(ProjectMqttSubscriberGetStatusRequest) returns (CommandResponse);

  // Patch one or more MQTT subscriber driver fields. Pass only the keys you want to change. Setting 'password' requires 'username' in the same call. Mutating fields while connected schedules a reconnect.
  rpc ProjectMqttSubscriberSetConfig(ProjectMqttSubscriberSetConfigRequest) returns (CommandResponse);

  // Reset to a blank project (one default UART source, no groups, no datasets, no actions, no workspaces). DESTRUCTIVE: discards the loaded project. Use only when the user explicitly says "start over" or "new project". For starting a TYPED project, prefer project.template.apply -- it gives the user a useful skeleton instead of an empty canvas. Pass dryRun:true to see what the current project (wouldDiscard) looks like before wiping it.
  rpc ProjectNew(ProjectNewRequest) returns (CommandResponse);

  // Open a .ssproj or .json project file. Replaces the current project. Auto-switches operationMode to ProjectFile if it was QuickPlot or ConsoleOnly. Path must be absolute. Pass dryRun:true to read the file and return wouldDiscard + wouldApply summaries without loading.
  rpc ProjectOpen(ProjectOpenRequest) returns (CommandResponse);

  // Add an output widget to a group (params: groupId, type)
  rpc ProjectOutputWidgetAdd(ProjectOutputWidgetAddRequest) returns (CommandResponse);

  // Delete an output widget by id (params: groupId, widgetId)
  rpc ProjectOutputWidgetDelete(ProjectOutputWidgetDeleteRequest) returns (CommandResponse);

  // Compile an output-widget transmit function WITHOUT touching the live project. Verifies the script compiles and defines transmit(value); returns ok / compileError + line. The transmitFunction is **JavaScript only** and runs with the same injected Modbus/CAN helper globals + table API as the live widget. Pass inputValue (and hex:true for hex byte input) to also execute it once and return the produced bytes (outputHex + byteCount). Validate here BEFORE project.outputWidget.update.
  rpc ProjectOutputWidgetDryRun(ProjectOutputWidgetDryRunRequest) returns (CommandResponse);

  // Duplicate an output widget by id (params: groupId, widgetId)
  rpc ProjectOutputWidgetDuplicate(ProjectOutputWidgetDuplicateRequest) returns (CommandResponse);

  // Read the current configuration of an output widget (params: groupId, widgetId). Returns title, icon, type, min/max/step/initialValue, transmitFunction. Use BEFORE rewriting the transmitFunction so you preserve the user's current ranges and labels.
  rpc ProjectOutputWidgetGet(ProjectOutputWidgetGetRequest) returns (CommandResponse);

  // Patch output-widget fields by id (params: groupId, widgetId, plus any of title, icon, transmitFunction, sourceId, txEncoding, monoIcon, minValue, maxValue, stepSize, initialValue). The transmitFunction is **JavaScript only** -- runs in QJSEngine to convert UI state into device bytes. **Call meta.fetchScriptingDocs{kind:'output_widget_js'} before authoring** for the function signature (transmit(value) returning a Uint8Array / string), the per-widget value semantics, and the injected Modbus/CAN helper globals (modbusWriteRegister / modbusWriteCoil / modbusWriteFloat / canSendFrame / canSendValue). Validate first with project.outputWidget.dryRun.
  rpc ProjectOutputWidgetUpdate(ProjectOutputWidgetUpdateRequest) returns (CommandResponse);

  // Compile a painter program WITHOUT touching the live project. Verifies that paint(ctx, w, h) exists and that the script compiles cleanly; does NOT actually render to a canvas. Returns ok / lastError. Params: code (string).
  rpc ProjectPainterDryRun(ProjectPainterDryRunRequest) returns (CommandResponse);

  // Get the painter widget JS for a group (params: groupId)
  rpc ProjectPainterGetCode(ProjectPainterGetCodeRequest) returns (CommandResponse);

  // Set the painter widget code for a group (params: groupId, code). **JavaScript only** -- painter scripts run in QJSEngine, not Lua. Available globals: ctx (2D canvas context, QPainter-like), w, h (canvas dimensions), datasetGetFinal(uid)/datasetGetRaw(uid). The entry point is paint(ctx, w, h) and an optional zero-arg onFrame() callback. Validate with project.painter.dryRun before setCode. **Always call meta.fetchScriptingDocs{kind:'painter_js'} first** for the full API surface and worked examples -- don't invent canvas methods from JS DOM Canvas, the surface is QPainter-shaped.
  rpc ProjectPainterSetCode(ProjectPainterSetCodeRequest) returns (CommandResponse);

  // Replay the most recently undone project-document step. Returns {performed:false, reason} when there is nothing to redo. Any new mutation after an undo discards the redo tail.
  rpc ProjectRedo(ProjectRedoRequest) returns (CommandResponse);

  // Write the current project to disk. Note: the AI runtime auto-saves after every successful mutating tool call within ~1 second, so you do NOT need to call this explicitly when editing. Call it ONLY when the user explicitly says "save" or wants a different file path -- in which case pass {filePath: "/abs/path"} for headless save-as.
  rpc ProjectSave(ProjectSaveRequest) returns (CommandResponse);

  // Case-insensitive substring search across every project entity type: datasets (title, alias, units), groups, actions, sources, workspaces, and data tables (title/name). Returns compact typed rows -- never full objects -- with matchCount, window/nextOffset paging (default limit 20, max 100), and projectEpoch. THE starting point for finding anything in a large project; drill into hits with project.dataset.getByUniqueId / getByPath or project.group.get.
  rpc ProjectSearch(ProjectSearchRequest) returns (CommandResponse);

  // Rename the project (only the in-app title). Does not move or rename the .ssproj file on disk; auto-save still writes to the existing file path. To save to a different file, use project.save{filePath}.
  rpc ProjectSetTitle(ProjectSetTitleRequest) returns (CommandResponse);

  // Composite read of the active project: title, sources, groups + datasets, workspaces summary, and data tables summary -- in one round trip. Pass verbose=true for source-level frame settings and frame parser source. Prefer this over chaining list/get calls.
  // Every level (top, source, group, dataset) carries an `_explanations` object with prose translations of enum/bitflag fields (operationMode, busType, frameDetection, decoderMethod, frameParserLanguage, enabledOptions, transformLanguage) and a one-line summary of the project's operating shape -- read those first; the raw int fields stay alongside for machine processing.
  // Response includes `projectEpoch`, a monotonic counter that bumps on every structural mutation (group/dataset add, delete, move, source add/delete). Cache this value alongside any uniqueIds you pull from the snapshot, then pass `expectedProjectEpoch` to any later mutating command (dataset.update/move/delete, group.move/delete) -- the response will carry a stale_project warning if the project changed under you, so you can refetch before acting on now-shifted uniqueIds.
  // Large projects: `sections` picks which blocks to include, and offset/limit windows the groups array (reply carries nextOffset); groupCount/datasetCount always reflect the whole project.
  rpc ProjectSnapshot(ProjectSnapshotRequest) returns (CommandResponse);

  // Add a new source (Commercial)
  rpc ProjectSourceAdd(ProjectSourceAddRequest) returns (CommandResponse);

  // Delete a source (Commercial; sourceId >= 1)
  rpc ProjectSourceDelete(ProjectSourceDeleteRequest) returns (CommandResponse);

  // Get full source configuration (params: sourceId)
  rpc ProjectSourceGetConfig(ProjectSourceGetConfigRequest) returns (CommandResponse);

  // Get per-source JS frame parser (params: sourceId)
  rpc ProjectSourceGetFrameParserCode(ProjectSourceGetFrameParserCodeRequest) returns (CommandResponse);

  // List all project sources
  rpc ProjectSourceList(ProjectSourceListRequest) returns (CommandResponse);

  // Set per-source JS frame parser (params: sourceId, code)
  rpc ProjectSourceSetFrameParserCode(ProjectSourceSetFrameParserCodeRequest) returns (CommandResponse);

  // Set multiple driver properties at once (params: sourceId, settings)
  rpc ProjectSourceSetProperties(ProjectSourceSetPropertiesRequest) returns (CommandResponse);

  // Set a driver connection property (params: sourceId, key, value)
  rpc ProjectSourceSetProperty(ProjectSourceSetPropertyRequest) returns (CommandResponse);

  // Patch source fields by id (Commercial). Required: sourceId. Optional fields: title, busType, frameStart, frameEnd, checksumAlgorithm, frameDetection, decoderMethod, hexadecimalDelimiters.
  rpc ProjectSourceUpdate(ProjectSourceUpdateRequest) returns (CommandResponse);

  // Replace the current project with a starter template -- the right first move when the user says "set me up an X project" rather than "add an X to my existing project". DESTRUCTIVE: discards any unsaved current state; auto-save will write the new template to disk shortly after. After applying, narrate what landed (groups, datasets) so the user knows what they got, then proceed with any follow-up edits the user requested. Available templates and their best fit:
  //   blank: empty project, one default UART source. Use when the user wants to build everything themselves.
  //   imu_uart: 9-DOF IMU (accelerometer X/Y/Z + gyro X/Y/Z + mag X/Y/Z) over UART, comma-separated, $ start / ; end. Replace the frame parser if your device frames differ.
  //   gps_uart_nmea: GPS over UART using NMEA 0183 ($GPGGA). Lat/lon/altitude/satellites/HDOP/fixQuality. Map widget configured.
  //   scope_multichannel_uart: 8 generic channels over UART, comma-separated, all plot-enabled. Adapt for ADC streams or sensor arrays.
  //   telemetry_udp: CSV body parser with 5 generic value channels, intended for UDP telemetry. The template does NOT configure the connection -- set up the UDP listener via io.network.* after applying.
  //   mqtt_subscriber (Pro): MQTT subscriber-mode skeleton. After applying, configure the broker via project.mqtt.subscriber.setConfig.
  // Pass dryRun:true to return wouldDiscard + wouldApply summaries without applying. Useful when the user is choosing between two templates.
  rpc ProjectTemplateApply(ProjectTemplateApplyRequest) returns (CommandResponse);

  // List built-in starter project templates (id, title, description). Use this BEFORE project.template.apply when the user asks for a starter ("set me up an IMU project", "give me a GPS template").
  rpc ProjectTemplateList(ProjectTemplateListRequest) returns (CommandResponse);

  // Undo the most recent project-document mutation (from any surface: editor UI, API, or batch -- one shared history). A batch or cascade reverts atomically as one step. Returns {performed:false, reason} when history is empty; never an error. History clears on project load/new. Not for workspace or widget-layout edits (those are outside undo history).
  rpc ProjectUndo(ProjectUndoRequest) returns (CommandResponse);

  // Walk the loaded project and report inconsistencies (missing source references, parser compile errors, empty groups, duplicate dataset indexes, etc.). Returns {ok, issues:[{level, location, message}], issueCount, groupCount, sourceCount, actionCount}. Call before project.save when building a project programmatically.
  rpc ProjectValidate(ProjectValidateRequest) returns (CommandResponse);

  // Create a new workspace (params: title="Workspace"). Returns new id.
  rpc ProjectWorkspaceAdd(ProjectWorkspaceAddRequest) returns (CommandResponse);

  // Pin a visualization tile onto a workspace. The tile renders the dashboard widget of the given widgetType fed by the given groupId. MANDATORY pre-flight: call project.group.list (for groupId + compatibleWidgetTypes) and project.workspace.list (for workspaceId) BEFORE calling this command. Calling it without that information produces validation errors. If your widgetType isn't in the group's compatibleWidgetTypes, first flip the matching dataset option via project.dataset.setOption / project.dataset.setOptions / project.dataset.update {graph|fft|led|waterfall}, then re-list and call addWidget.
  // Batching: for 5+ widget mutations, wrap calls in project.batch{ops:[{command:'project.workspace.addWidget', params:{...}}, ...]} -- workspace ops execute correctly inside batch and the whole burst lands as a single autosave (see meta.describeCommand{name:'project.batch'}). Returns widgetId for use with removeWidget.
  rpc ProjectWorkspaceAddWidget(ProjectWorkspaceAddWidgetRequest) returns (CommandResponse);

  // Materialise synthetic workspaces into the customised set. No-op if already customised.
  rpc ProjectWorkspaceAutoGenerate(ProjectWorkspaceAutoGenerateRequest) returns (CommandResponse);

  // Drop workspace widget refs that no longer resolve to a live group/dataset/widgetType. Scope: orphans only -- does NOT touch refs where the group still exists but compatibleWidgetTypes has changed (that's reversible state). Set dryRun:true to enumerate what would be removed without mutating.
  rpc ProjectWorkspaceCleanup(ProjectWorkspaceCleanupRequest) returns (CommandResponse);

  // Wipe every workspace in one call. Forces customize mode on and leaves an empty list. Use this instead of looping project.workspace.delete -- one approval card, one autosave flush. Follow with project.workspace.autoGenerate to restore the default Overview/AllData/per-group layout, or project.workspace.add + addWidget to build a custom layout. Pass dryRun:true to enumerate every workspace that would be removed before committing.
  rpc ProjectWorkspaceClearAll(ProjectWorkspaceClearAllRequest) returns (CommandResponse);

  // Delete a workspace by id. Pass dryRun:true to preview the workspace + widgetCount that would be removed without committing.
  rpc ProjectWorkspaceDelete(ProjectWorkspaceDeleteRequest) returns (CommandResponse);

  // Return widget refs for a workspace (params: id)
  rpc ProjectWorkspaceGet(ProjectWorkspaceGetRequest) returns (CommandResponse);

  // Return the customizeWorkspaces flag
  rpc ProjectWorkspaceGetCustomizeMode(ProjectWorkspaceGetCustomizeModeRequest) returns (CommandResponse);

  // List all workspaces with widget counts
  rpc ProjectWorkspaceList(ProjectWorkspaceListRequest) returns (CommandResponse);

  // Remove a widget ref. Pass either {widgetId} from a prior addWidget/get response, or the legacy tuple {workspaceId, widgetType, groupId, relativeIndex}.
  // Batching: for 5+ widget removals, wrap calls in project.batch{ops:[...]} (see meta.describeCommand{name:'project.batch'}).
  rpc ProjectWorkspaceRemoveWidget(ProjectWorkspaceRemoveWidgetRequest) returns (CommandResponse);

  // Rename a workspace (params: id, title)
  rpc ProjectWorkspaceRename(ProjectWorkspaceRenameRequest) returns (CommandResponse);

  // Reorder user-defined workspaces (workspaceId >= 5000) in the taskbar. Pass every user workspace id in the desired order -- partial reorders are rejected to avoid silent corruption. System workspaces (auto-generated, ids 1000-4999) keep their original slots.
  rpc ProjectWorkspaceReorder(ProjectWorkspaceReorderRequest) returns (CommandResponse);

  // Flip the customizeWorkspaces flag (params: enabled)
  rpc ProjectWorkspaceSetCustomizeMode(ProjectWorkspaceSetCustomizeModeRequest) returns (CommandResponse);

  // Patch workspace fields (params: id; optional title, icon, description)
  rpc ProjectWorkspaceUpdate(ProjectWorkspaceUpdateRequest) returns (CommandResponse);

  // Walk workspace widget refs and report orphaned references (the group/dataset/widgetType combo no longer exists). Read-only -- does not modify project state or toggle customizeWorkspaces. Pair with project.workspace.cleanup to repair. Pass an optional workspaceId to limit scope; omit to validate all workspaces.
  rpc ProjectWorkspaceValidate(ProjectWorkspaceValidateRequest) returns (CommandResponse);

  // Read the body of one bundled reference script (params: kind, id). The id is the `file` field from scripts.list (no extension).
  rpc ScriptsGet(ScriptsGetRequest) returns (CommandResponse);

  // List bundled reference scripts the dashboard ships with. Use this BEFORE writing painter / frame-parser / transform / output-widget code so you can adapt real templates instead of inventing patterns. Optional params: kind (filter to one kind: painter, frame_parser_js, frame_parser_lua, transform_js, transform_lua, output_widget_js).
  rpc ScriptsList(ScriptsListRequest) returns (CommandResponse);

  // Create a new tag (params: label)
  rpc SessionsAddTag(SessionsAddTagRequest) returns (CommandResponse);

  // Assign a tag to a session (params: sessionId, tagId)
  rpc SessionsAssignTag(SessionsAssignTagRequest) returns (CommandResponse);

  // Finalize and close the current session (no-op if none open)
  rpc SessionsClose(SessionsCloseRequest) returns (CommandResponse);

  // Delete a stored session by id (params: sessionId)
  rpc SessionsDelete(SessionsDeleteRequest) returns (CommandResponse);

  // Delete a tag by id (params: tagId)
  rpc SessionsDeleteTag(SessionsDeleteTagRequest) returns (CommandResponse);

  // Export a stored session to CSV (async; params: sessionId)
  rpc SessionsExportToCsv(SessionsExportToCsvRequest) returns (CommandResponse);

  // Return metadata + tags for one stored session (params: sessionId)
  rpc SessionsGet(SessionsGetRequest) returns (CommandResponse);

  // Return the canonical .db path for a given project title
  rpc SessionsGetDbPath(SessionsGetDbPathRequest) returns (CommandResponse);

  // Return the running flag, last regression drift report, and sweep status (no params)
  rpc SessionsGetRegression(SessionsGetRegressionRequest) returns (CommandResponse);

  // Return the session-recording flags (exportEnabled, isOpen)
  rpc SessionsGetStatus(SessionsGetStatusRequest) returns (CommandResponse);

  // Return the latest stored verification verdict for a session (params: sessionId)
  rpc SessionsGetVerification(SessionsGetVerificationRequest) returns (CommandResponse);

  // List all sessions stored in the currently open database
  rpc SessionsList(SessionsListRequest) returns (CommandResponse);

  // List all tags defined in the open database
  rpc SessionsListTags(SessionsListTagsRequest) returns (CommandResponse);

  // Open a session database file for browsing (params: filePath)
  rpc SessionsOpenDatabase(SessionsOpenDatabaseRequest) returns (CommandResponse);

  // Compare a stored session (or every session with a tag) against a candidate project in a child process (async; poll sessions.getRegression; params: sessionId | tag, projectPath?, projectJson?)
  rpc SessionsRegress(SessionsRegressRequest) returns (CommandResponse);

  // Remove a tag from a session (params: sessionId, tagId)
  rpc SessionsRemoveTag(SessionsRemoveTagRequest) returns (CommandResponse);

  // Rename a tag (params: tagId, newLabel)
  rpc SessionsRenameTag(SessionsRenameTagRequest) returns (CommandResponse);

  // Start the player on a stored session (params: sessionId)
  rpc SessionsReplay(SessionsReplayRequest) returns (CommandResponse);

  // Turn session recording on/off (params: enabled)
  rpc SessionsSetExportEnabled(SessionsSetExportEnabledRequest) returns (CommandResponse);

  // Set free-form notes on a stored session (params: sessionId, notes)
  rpc SessionsSetNotes(SessionsSetNotesRequest) returns (CommandResponse);

  // Verify a stored session's reproducibility in a child process (async; poll sessions.getVerification; params: sessionId)
  rpc SessionsVerify(SessionsVerifyRequest) returns (CommandResponse);

  // Report the typed sample-stream surface: how many stream sources are live, the wire encoding of a streamBlock line (base64 float32le), the per-subscriber queue depth before the oldest block is dropped and counted, and the names of the connection-scoped commands (stream.subscribe / stream.unsubscribe) a subscriber sends on its own socket.
  rpc StreamGetInfo(StreamGetInfoRequest) returns (CommandResponse);

  // List every live stream source: sourceId, channel count, sample rate, and the dataset uniqueIds its blocks carry.
  rpc StreamGetSources(StreamGetSourcesRequest) returns (CommandResponse);

  // Launch a helper process (e.g. "python" with a script path). Control script only -- rejected over the network/SDK. workingDir defaults to the project directory. Returns a processId. The process is terminated automatically when the device disconnects, the project changes, or the app quits.
  rpc SystemExec(SystemExecRequest) returns (CommandResponse);

  // Terminate a managed helper process by id. Control script only.
  rpc SystemKill(SystemKillRequest) returns (CommandResponse);

  // Return the loaded project's directory, file path, and file name. Use this to resolve paths relative to the .ssproj (e.g. a sibling Python script) before calling system.exec.
  rpc SystemProjectDir(SystemProjectDirRequest) returns (CommandResponse);

  // List the helper processes currently managed by system.exec.
  rpc SystemRunningProcesses(SystemRunningProcessesRequest) returns (CommandResponse);

  // Get serialized layout JSON from WindowManager
  rpc UiWindowGetLayout(UiWindowGetLayoutRequest) returns (CommandResponse);

  // Get dashboard window status: activeGroupId, groupCount, autoLayoutEnabled
  rpc UiWindowGetStatus(UiWindowGetStatusRequest) returns (CommandResponse);

  // Get saved widget settings (params: widgetId string)
  rpc UiWindowGetWidgetSettings(UiWindowGetWidgetSettingsRequest) returns (CommandResponse);

  // Get list of groups as [{id, text, icon}]
  rpc UiWindowListGroups(UiWindowListGroupsRequest) returns (CommandResponse);

  // Get window states array [{id, state}] for current group
  rpc UiWindowListWindowStates(UiWindowListWindowStatesRequest) returns (CommandResponse);

  // Load window layout from project
  rpc UiWindowLoadLayout(UiWindowLoadLayoutRequest) returns (CommandResponse);

  // Save current window layout to project
  rpc UiWindowSaveLayout(UiWindowSaveLayoutRequest) returns (CommandResponse);

  // Set active group by ID (params: groupId int)
  rpc UiWindowSetActiveGroup(UiWindowSetActiveGroupRequest) returns (CommandResponse);

  // Set active group by index (params: index int)
  rpc UiWindowSetActiveGroupIndex(UiWindowSetActiveGroupIndexRequest) returns (CommandResponse);

  // Enable or disable auto layout (params: enabled bool)
  rpc UiWindowSetAutoLayout(UiWindowSetAutoLayoutRequest) returns (CommandResponse);

  // Apply a layout to WindowManager (params: layout object)
  rpc UiWindowSetLayout(UiWindowSetLayoutRequest) returns (CommandResponse);

  // Set a widget setting (params: widgetId string, key string, value any)
  rpc UiWindowSetWidgetSetting(UiWindowSetWidgetSettingRequest) returns (CommandResponse);

  // Set window state (params: id int, state int: 0=normal,1=minimized,2=closed)
  rpc UiWindowSetWindowState(UiWindowSetWindowStateRequest) returns (CommandResponse);

  // Streaming RPCs
  rpc StreamFrames(StreamRequest) returns (stream FrameData);
  rpc StreamRawData(StreamRequest) returns (stream RawData);
  rpc WriteRawData(RawDataRequest) returns (CommandResponse);
  rpc ListCommands(google.protobuf.Empty) returns (CommandList);
}
