// Typed service with per-command RPCs
service SerialStudioTypedAPI {
  // Get list of all available commands
  rpc ApiGetCommands(ApiGetCommandsRequest) returns (CommandResponse);

  // Force an immediate project snapshot to disk and return its absolute path. Call BEFORE any multi-step risky edit so you can roll back atomically with assistant.restore if any subsequent step fails. Optional `label` lets you tag the snapshot for retrieval by name. Snapshots are kept rolling (last 50 per project) under the OS app-data backup directory.
  rpc AssistantCheckpoint(AssistantCheckpointRequest) returns (CommandResponse);

  // Resolve a dataset by path, title, or uniqueId in one call -- dispatches to project.dataset.getByPath / .getByTitle / .getByUniqueId depending on which key is set. Exactly one of {path, title, uniqueId} must be provided; uniqueId also accepts a string alias.
  rpc AssistantDatasetResolve(AssistantDatasetResolveRequest) returns (CommandResponse);

  // List the rolling backup snapshots for the currently loaded project, newest first. Returns `{checkpoints: [{path, timestamp, sizeBytes, label}], count, directory}`. The `directory` field is the absolute backup folder path -- useful for surfacing in UI escape hatches.
  rpc AssistantListCheckpoints(AssistantListCheckpointsRequest) returns (CommandResponse);

  // Propose remembering a small durable fact for future chats (a stated preference, a correction you were given, a project convention). The user sees a confirmation chip and decides; this call NEVER stores anything by itself. Categories: user (who they are / preferences), feedback (corrections), project (facts about the open project), reference (where to find things).
  rpc AssistantMemoryPropose(AssistantMemoryProposeRequest) returns (CommandResponse);

  // Run several project mutations atomically with respect to autosave. Identical contract to project.batch (max 1024 ops, stopOnError default false, NOT a database transaction) but pre-validates that no op tries to nest another batch. Pass dryRun:true at the top level to preview every op without committing -- forwarded to project.batch which rejects the dryRun when any op is not in the dryRun-aware command set.
  rpc AssistantProjectBulkApply(AssistantProjectBulkApplyRequest) returns (CommandResponse);

  // Restore a previously taken checkpoint, replacing the current project state. Provide one of: `path` (absolute path returned by assistant.checkpoint or from a delete response's `backupPath`), `timestamp` (ISO string from assistant.listCheckpoints), or `label` (most recent checkpoint matching this label). DESTRUCTIVE: any unsaved current state is overwritten -- a defensive pre-restore snapshot is taken and returned as `reverseSnapshotPath` so you can undo the restore itself.
  rpc AssistantRestore(AssistantRestoreRequest) returns (CommandResponse);

  // Dry-run a script then write it via the matching setCode endpoint. Falls back to dryCompile for frame_parser when no inputBytes(Hex) is supplied, and defaults transform values to [0.0] so callers can apply without test inputs. Returns steps[] so the LLM can see exactly which stage ran. If the dry run fails, setCode is NOT called.
  rpc AssistantScriptApply(AssistantScriptApplyRequest) returns (CommandResponse);

  // Validate a script by kind without writing. Routes to project.frameParser.dryRun, project.dataset.transform.dryRun, project.painter.dryRun, project.outputWidget.dryRun, or project.dryRun.endToEnd based on `kind`. All other params are forwarded verbatim (code, language, values, inputValue / hex for output_widget, sampleFrame / sampleFrames for end_to_end, plus for frame_parser the pipeline inputs inputBytesHex / decoderMethod / frameDetection / frameStart / frameEnd / hexadecimalDelimiters / checksumAlgorithm / operationMode).
  rpc AssistantScriptDryRun(AssistantScriptDryRunRequest) returns (CommandResponse);

  // Token-efficient project snapshot for LLMs. Identical payload to project.snapshot -- prefer this name in skill docs so the assistant rails stay grouped. Optional verbose=true includes parser code and per-source frame settings.
  rpc AssistantSnapshot(AssistantSnapshotRequest) returns (CommandResponse);

  // Add a tile to a workspace in one call. Chains: resolve dataset (by path or uniqueId) -> resolve or create workspace -> setCustomizeMode(true) -> setOptions to enable the matching DatasetOption bit -> patch ranges (pltMin/pltMax/wgtMin/wgtMax/fftMin/fftMax/ledHigh) -> addWidget. Returns steps[] so the LLM can see which sub-call failed. For group-level widgets (datagrid/multiplot/led/accelerometer/gyroscope/gps/plot3d/painter/imageview/output-panel), omit dataset/uniqueId and pass groupId directly.
  rpc AssistantWorkspaceAddTile(AssistantWorkspaceAddTileRequest) returns (CommandResponse);

  // Plan a workspace edit: returns the (groupId, widgetType) tuples whose compatibleWidgetTypeSlugs match the optional widgetType filter. Use this before assistant.workspace.addTile to discover which groups can host a given visualization. Falls back to listing every compatible tuple when no widgetType filter is set.
  rpc AssistantWorkspacePlan(AssistantWorkspacePlanRequest) returns (CommandResponse);

  // Resolve a workspace by id or case-insensitive title. Returns the matching workspace summary or an error with candidates[] for ambiguous / missing lookups.
  rpc AssistantWorkspaceResolve(AssistantWorkspaceResolveRequest) returns (CommandResponse);

  // Clear console
  rpc ConsoleClear(ConsoleClearRequest) returns (CommandResponse);

  // Get all console settings
  rpc ConsoleGetConfig(ConsoleGetConfigRequest) returns (CommandResponse);

  // Send data to device
  rpc ConsoleSend(ConsoleSendRequest) returns (CommandResponse);

  // Toggle ANSI / xterm color sequences in console output
  rpc ConsoleSetAnsiColorsEnabled(ConsoleSetAnsiColorsEnabledRequest) returns (CommandResponse);

  // Set checksum method
  rpc ConsoleSetChecksumMethod(ConsoleSetChecksumMethodRequest) returns (CommandResponse);

  // Collapse consecutive duplicate lines
  rpc ConsoleSetCollapseDuplicates(ConsoleSetCollapseDuplicatesRequest) returns (CommandResponse);

  // Set data mode
  rpc ConsoleSetDataMode(ConsoleSetDataModeRequest) returns (CommandResponse);

  // Set display mode
  rpc ConsoleSetDisplayMode(ConsoleSetDisplayModeRequest) returns (CommandResponse);

  // Enable/disable echo
  rpc ConsoleSetEcho(ConsoleSetEchoRequest) returns (CommandResponse);

  // Set the text encoding used to decode incoming bytes (params: encoding -- index into console.getConfig.textEncodings)
  rpc ConsoleSetEncoding(ConsoleSetEncodingRequest) returns (CommandResponse);

  // Set font family
  rpc ConsoleSetFontFamily(ConsoleSetFontFamilyRequest) returns (CommandResponse);

  // Set font size
  rpc ConsoleSetFontSize(ConsoleSetFontSizeRequest) returns (CommandResponse);

  // Set line ending
  rpc ConsoleSetLineEnding(ConsoleSetLineEndingRequest) returns (CommandResponse);

  // Toggle case-sensitive console search
  rpc ConsoleSetSearchCaseSensitive(ConsoleSetSearchCaseSensitiveRequest) returns (CommandResponse);

  // Show/hide timestamps
  rpc ConsoleSetShowTimestamp(ConsoleSetShowTimestampRequest) returns (CommandResponse);

  // Toggle VT100 / xterm escape sequence interpretation
  rpc ConsoleSetVt100Emulation(ConsoleSetVt100EmulationRequest) returns (CommandResponse);

  // Close console export file
  rpc ConsoleExportClose(ConsoleExportCloseRequest) returns (CommandResponse);

  // Get console export status
  rpc ConsoleExportGetStatus(ConsoleExportGetStatusRequest) returns (CommandResponse);

  // Enable/disable console export
  rpc ConsoleExportSetEnabled(ConsoleExportSetEnabledRequest) returns (CommandResponse);

  // Validate control-script source WITHOUT installing or running it (params: code). Compiles the script in a sandboxed engine with the SDK prelude, reports syntax errors with line numbers, and checks that setup() and/or loop() are defined. setup()/loop() are never executed and apiCall/tableSet have no effect. Use before controlScript.set.
  rpc ControlScriptDryRun(ControlScriptDryRunRequest) returns (CommandResponse);

  // Get the project's setup()/loop() control script source code.
  rpc ControlScriptGet(ControlScriptGetRequest) returns (CommandResponse);

  // Get the control script source (alias of controlScript.get; matches the project.frameParser.getCode naming convention).
  rpc ControlScriptGetCode(ControlScriptGetCodeRequest) returns (CommandResponse);

  // Returns whether the control script is currently running.
  rpc ControlScriptGetStatus(ControlScriptGetStatusRequest) returns (CommandResponse);

  // Replace the project's control script source (params: code). The script is persisted in the project and applied to the live runtime; if a device is connected it is recompiled and restarted immediately. Validate first with controlScript.dryRun.
  rpc ControlScriptSet(ControlScriptSetRequest) returns (CommandResponse);

  // Replace the control script source (alias of controlScript.set; params: code; matches the project.frameParser.setCode naming convention).
  rpc ControlScriptSetCode(ControlScriptSetCodeRequest) returns (CommandResponse);

  // Close the current CSV file
  rpc CsvExportClose(CsvExportCloseRequest) returns (CommandResponse);

  // Get CSV export status
  rpc CsvExportGetStatus(CsvExportGetStatusRequest) returns (CommandResponse);

  // Enable or disable CSV export (params: enabled)
  rpc CsvExportSetEnabled(CsvExportSetEnabledRequest) returns (CommandResponse);

  // Set the CSV logging cadence (params: intervalMs). 0 (default) writes one row per received frame; a positive value switches the recorder to a fixed-interval snapshot log where every row carries the latest value of every column -- use this for multi-source or high-rate projects where per-frame rows explode the file size. Applies live to an open recording and persists across restarts.
  rpc CsvExportSetInterval(CsvExportSetIntervalRequest) returns (CommandResponse);

  // Close CSV file
  rpc CsvPlayerClose(CsvPlayerCloseRequest) returns (CommandResponse);

  // Get player status
  rpc CsvPlayerGetStatus(CsvPlayerGetStatusRequest) returns (CommandResponse);

  // Open CSV file (params: filePath)
  rpc CsvPlayerOpen(CsvPlayerOpenRequest) returns (CommandResponse);

  // Pause or resume playback (params: paused: bool)
  rpc CsvPlayerSetPaused(CsvPlayerSetPausedRequest) returns (CommandResponse);

  // Seek to position (params: progress: 0.0-1.0)
  rpc CsvPlayerSetProgress(CsvPlayerSetProgressRequest) returns (CommandResponse);

  // Step delta frames forward (or backward if negative; default 1)
  rpc CsvPlayerStep(CsvPlayerStepRequest) returns (CommandResponse);

  // Get dashboard widget counts and latest frame data
  rpc DashboardGetData(DashboardGetDataRequest) returns (CommandResponse);

  // Get the current visualization refresh rate
  rpc DashboardGetFps(DashboardGetFpsRequest) returns (CommandResponse);

  // Get the current operation mode
  rpc DashboardGetOperationMode(DashboardGetOperationModeRequest) returns (CommandResponse);

  // Get all dashboard configuration settings
  rpc DashboardGetStatus(DashboardGetStatusRequest) returns (CommandResponse);

  // Get the current visible plot time window in seconds
  rpc DashboardGetTimeRange(DashboardGetTimeRangeRequest) returns (CommandResponse);

  // Re-run every dataset transform from the last received values and republish the frames to the dashboard (no export side effects). Dataset transforms normally run only when a device frame arrives; call this after project.dataTable.setValue writes (control scripts: tableSet()) so the dashboard reflects them while the device is silent.
  rpc DashboardReprocess(DashboardReprocessRequest) returns (CommandResponse);

  // Set the visualization refresh rate (params: fps - 1-240 Hz)
  rpc DashboardSetFps(DashboardSetFpsRequest) returns (CommandResponse);

  // Set the operation mode (params: mode - 0=ProjectFile, 1=ConsoleOnly, 2=QuickPlot)
  rpc DashboardSetOperationMode(DashboardSetOperationModeRequest) returns (CommandResponse);

  // Set the visible plot time window (params: seconds - 0.001-300)
  rpc DashboardSetTimeRange(DashboardSetTimeRangeRequest) returns (CommandResponse);

  // Return the last N samples (timestamp + value pairs) for each plot-enabled dataset. Use to debug "the values look wrong" complaints without polling dashboard.getData repeatedly. Only returns datasets whose plt flag is on; toggle it via project.dataset.setOption first if you need history for a different dataset.
  rpc DashboardTailFrames(DashboardTailFramesRequest) returns (CommandResponse);

  // Force a dashboard render from the current table/dataset state, synthesizing the project frame structure if no device frame has arrived yet. Unlike dashboard.reprocess (which no-ops until a real frame exists and never feeds exporters), this lets a control script that only writes tables (tableSet()) render table-driven virtual datasets from the very first loop(), and it also fans the synthesized frame out to the enabled export sinks (CSV/MDF4/session/MQTT/API). SDK: dashboardTick().
  rpc DashboardTick(DashboardTickRequest) returns (CommandResponse);

  // Check whether this machine is set up to connect: serial-port permissions and the exact command that fixes them on Linux, Bluetooth adapter power and permission, audio inputs, and whether the configured host or broker resolves and accepts a connection. THE first call when a connection fails or the Connect button does nothing. Returns immediately with the instant results already complete; slower reachability probes finish in the background. Optional param: bus.
  rpc DiagnosticsRun(DiagnosticsRunRequest) returns (CommandResponse);

  // Report whether a diagnostics run is still probing, when the last run finished, and how many results of each verdict stand. Poll this after diagnostics.run, then read the findings with problems.list filtered by checkerId 'diagnostics.<bus>'.
