  rpc ProjectActivate(ProjectActivateRequest) returns (CommandResponse);

  // Run several project mutations atomically WITH RESPECT TO AUTOSAVE -- all ops execute sequentially under one suspended-autosave window, and a single save is flushed at the end. Use this whenever you would otherwise issue more than ~5 sequential mutations (renames, retypes, reindexes), since N round-trips cost N times the latency and N times the autosave/tree-rebuild churn.
  // Each op is {command: '<registered command name>', params: {...}}; results are returned in the same order with per-op success/error fields. Set stopOnError:true to abort the batch on the first failure (default false: best-effort, all ops attempted).
  // Pass dryRun:true at the top level to preview every op without committing. Each op's per-result still carries the affected-entity payload as if it had run. Rejected when any op is not in the dryRun-aware command set -- mixing previewable and non-previewable ops would leave a partial mutation, which is worse than no preview at all.
  // Note: NOT transactional. Already-applied ops are NOT rolled back on later failures -- this is a save-suspend wrapper, not a database transaction. Nested project.batch calls are rejected. Hard cap of 1024 ops per call.
  // Example: rename 40 datasets in one round-trip:
  //   ops: [
  //     {command:'project.dataset.update', params:{groupId:0, datasetId:0, title:'LED 1', index:1}},
  //     {command:'project.dataset.update', params:{groupId:0, datasetId:1, title:'LED 2', index:2}},
  //     ...
  //   ]
  rpc ProjectBatch(ProjectBatchRequest) returns (CommandResponse);

  // Get the visible plot time window (alias of dashboard.getTimeRange).
  rpc ProjectDashboardGetTimeRange(ProjectDashboardGetTimeRangeRequest) returns (CommandResponse);

  // Get every display-title override (entity-level rows carry only uniqueId; widget-level rows also carry widgetType), each annotated with the canonical title it shadows (canonical:null when the target no longer exists).
  rpc ProjectDashboardGetWidgetTitles(ProjectDashboardGetWidgetTitlesRequest) returns (CommandResponse);

  // Set the visible plot time window (alias of dashboard.setTimeRange; the value is per-project and survives project reload).
  rpc ProjectDashboardSetTimeRange(ProjectDashboardSetTimeRangeRequest) returns (CommandResponse);

  // Set the freeze-mode title presentation for one widget (widgetType + uniqueId): bar shows the panel header, painted shows the title on the instrument face (Bar/Gauge/Meter only, their default), hidden shows no title while the dashboard is frozen. Every other widget type defaults to bar; writing a widget's default clears its stored entry.
  rpc ProjectDashboardSetWidgetFreezeTitle(ProjectDashboardSetWidgetFreezeTitleRequest) returns (CommandResponse);

  // Set a display-title override for the dataset/group with the given uniqueId. Without widgetType the override is entity-level (every widget of that dataset/group); with widgetType it targets only that widget kind (e.g. only the FFT of a dataset) and wins over the entity-level entry. Display-only: widget captions, freeze headers, painted instrument titles and taskbar entries show it, while exports, dashboard.getData and project.* responses keep the canonical title. Empty/absent title clears the override.
  rpc ProjectDashboardSetWidgetTitle(ProjectDashboardSetWidgetTitleRequest) returns (CommandResponse);

